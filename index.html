<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>碳核算管理平台 - 模块整合</title>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#6f9637",
            sidebar: "#143f29",
            surface: "#f4f1e7",
            "outline-variant": "#d5dec8",
            "on-surface": "#243021",
            "on-surface-variant": "#64705c"
          },
          fontFamily: {
            sans: ["Inter", "Microsoft YaHei", "sans-serif"]
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="./eco-admin-theme.css?v=20260722-shell2" rel="stylesheet" />
  <style>
    :root {
      --eco-green-950: #0f321f;
      --eco-green-900: #143f29;
      --eco-green-700: #2f6f3d;
      --eco-green-500: #6f9637;
      --eco-sage-300: #c9d7ad;
      --eco-sage-100: #f4f1e7;
      --eco-cream: #f8f5eb;
      --eco-text: #243021;
      --eco-muted: #64705c;
      --eco-line: rgba(55, 87, 42, 0.18);
      --eco-shadow: 0 18px 46px rgba(23, 63, 39, 0.17);
      --eco-shadow-soft: 0 10px 26px rgba(23, 63, 39, 0.1);
    }

    body {
      font-family: Inter, "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 14% 8%, rgba(201, 215, 173, 0.38), transparent 28%),
        linear-gradient(135deg, var(--eco-cream) 0%, var(--eco-sage-100) 100%);
      color: var(--eco-text);
    }

    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      vertical-align: middle;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(184, 211, 155, 0.78);
      border-radius: 999px;
    }

    aside.bg-sidebar {
      background:
        radial-gradient(circle at 12% 0%, rgba(157, 184, 91, 0.22), transparent 32%),
        linear-gradient(180deg, #173f28 0%, #143a25 46%, #102f1f 100%) !important;
      color: #fffdf6 !important;
      border-right: 1px solid rgba(255, 253, 246, 0.18);
      box-shadow: 16px 0 42px rgba(15, 50, 31, 0.22);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      background: rgba(255, 253, 245, 0.12);
      border: 1px solid rgba(255, 253, 245, 0.18);
      color: #dce9c2 !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(157, 184, 91, 0.12);
    }

    .brand-title {
      color: #fffdf5;
      letter-spacing: 0;
      line-height: 1.05;
      font-size: 16px;
      white-space: nowrap;
    }

    aside .border-slate-700 {
      border-color: rgba(255, 253, 246, 0.18) !important;
    }

    aside .fa-leaf {
      color: #dce9c2 !important;
      filter: drop-shadow(0 6px 14px rgba(15, 50, 31, 0.25));
    }

    aside .text-white,
    aside .text-slate-400 {
      color: #f7faee !important;
    }

    aside a,
    aside button {
      border-radius: 999px !important;
    }

    aside a:focus-visible,
    aside button:focus-visible {
      outline: 3px solid rgba(184, 211, 155, 0.58);
      outline-offset: 2px;
      box-shadow: 0 0 0 6px rgba(220, 234, 203, 0.18);
    }

    aside a:hover,
    aside button:hover {
      background: rgba(255, 253, 246, 0.14) !important;
    }

    aside button.bg-slate-800 {
      color: #fffdf6 !important;
      background: rgba(255, 253, 246, 0.13) !important;
      box-shadow: inset 0 0 0 1px rgba(255, 253, 246, 0.14), 0 10px 24px rgba(15, 50, 31, 0.16);
    }

    .sidebar-link {
      color: rgba(255, 253, 246, 0.78);
      transition: background-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .sidebar-link:hover {
      color: #fffdf6;
      background: rgba(255, 253, 246, 0.14);
    }

    .sidebar-link.active {
      color: var(--eco-green-900) !important;
      background: linear-gradient(180deg, #f7f4e8, var(--eco-sage-300));
      font-weight: 600;
      box-shadow: 0 12px 28px rgba(15, 50, 31, 0.24);
    }

    main.bg-surface {
      background:
        radial-gradient(circle at 80% 0%, rgba(201, 215, 173, 0.42), transparent 32%),
        linear-gradient(135deg, var(--eco-cream) 0%, var(--eco-sage-100) 100%) !important;
    }

    header.bg-white {
      margin: 16px 20px 0;
      height: 60px;
      border: 1px solid var(--eco-line) !important;
      border-radius: 999px;
      background: rgba(255, 253, 247, 0.82) !important;
      backdrop-filter: blur(18px);
      box-shadow: var(--eco-shadow-soft);
    }

    header .bg-primary {
      background: linear-gradient(180deg, var(--eco-green-500), var(--eco-green-700)) !important;
      box-shadow: 0 8px 18px rgba(47, 111, 61, 0.24);
    }

    #frame-shell {
      margin: 16px 20px 20px;
      border: 1px solid var(--eco-line);
      border-radius: 28px;
      background: rgba(255, 253, 247, 0.52);
      box-shadow: var(--eco-shadow);
      overflow: hidden;
    }

    #content-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      transition: opacity 160ms ease;
    }

    #loading-mask > div {
      border: 1px solid var(--eco-line) !important;
      border-radius: 999px !important;
      background: rgba(255, 253, 247, 0.9) !important;
      color: var(--eco-muted) !important;
      box-shadow: var(--eco-shadow-soft) !important;
    }
  </style>
</head>
<body class="h-screen overflow-hidden text-on-surface">
  <div class="flex h-full">
    <aside class="w-64 bg-sidebar text-white flex flex-col shrink-0">
      <div class="h-20 flex items-center px-6 gap-3 border-b border-slate-700">
        <i class="fa-solid fa-leaf brand-mark text-xl"></i>
        <div>
          <div class="brand-title font-bold text-lg">碳排放管理平台</div>
        </div>
      </div>

      <nav class="flex-1 overflow-y-auto custom-scrollbar py-4 px-3 space-y-1">
        <a class="flex items-center px-4 py-3 rounded-md text-slate-400 hover:text-white hover:bg-slate-700" href="javascript:void(0)">
          <i class="fa-solid fa-house w-6 text-center mr-3 text-sm"></i>
          运营总览
        </a>

        <div class="space-y-1">
          <button class="w-full flex items-center justify-between px-4 py-3 text-white bg-slate-800 rounded-md" type="button">
            <span class="flex items-center">
              <i class="fa-solid fa-calculator w-6 text-center mr-3 text-sm text-primary"></i>
              绿色碳核算
            </span>
            <i class="fa-solid fa-chevron-up text-[10px]"></i>
          </button>

          <div class="pl-10 space-y-1 py-1" id="sidebar-tabs">
            <button class="sidebar-link active block w-full text-left px-4 py-2 rounded-md text-sm" data-key="boundary" type="button">核算边界管理</button>
            <button class="sidebar-link block w-full text-left px-4 py-2 rounded-md text-sm" data-key="source" type="button">排放源管理</button>
            <button class="sidebar-link block w-full text-left px-4 py-2 rounded-md text-sm" data-key="datasource" type="button">数据源管理</button>
            <button class="sidebar-link block w-full text-left px-4 py-2 rounded-md text-sm" data-key="model" type="button">核算模型管理</button>
            <button class="sidebar-link block w-full text-left px-4 py-2 rounded-md text-sm" data-key="factor" type="button">因子库管理</button>
            <button class="sidebar-link block w-full text-left px-4 py-2 rounded-md text-sm" data-key="standard" type="button">标准管理</button>
            <button class="sidebar-link block w-full text-left px-4 py-2 rounded-md text-sm" data-key="gwp" type="button">GWP管理</button>
          </div>
        </div>

        <a class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md" href="javascript:void(0)">
          <span class="flex items-center"><i class="fa-solid fa-database w-6 text-center mr-3 text-sm"></i>排放数据资产</span>
          <i class="fa-solid fa-chevron-down text-[10px]"></i>
        </a>
        <a class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md" href="javascript:void(0)">
          <span class="flex items-center"><i class="fa-solid fa-chart-line w-6 text-center mr-3 text-sm"></i>碳绩效洞察</span>
          <i class="fa-solid fa-chevron-down text-[10px]"></i>
        </a>
        <a class="flex items-center justify-between px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-700 rounded-md" href="javascript:void(0)">
          <span class="flex items-center"><i class="fa-solid fa-file-invoice w-6 text-center mr-3 text-sm"></i>绿色披露报告</span>
          <i class="fa-solid fa-chevron-down text-[10px]"></i>
        </a>
      </nav>
    </aside>

    <main class="flex-1 min-w-0 flex flex-col bg-surface">
      <header class="h-16 bg-white border-b border-outline-variant flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-4">
          <i class="fa-solid fa-bars text-slate-500"></i>
          <nav class="flex items-center text-sm gap-2 text-on-surface-variant">
            <span>绿色碳核算</span>
            <span class="text-xs text-slate-300">/</span>
            <span class="text-on-surface font-semibold" id="current-title">核算边界管理</span>
          </nav>
        </div>
        <div class="flex items-center gap-6">
          <div class="relative cursor-pointer">
            <span class="material-symbols-outlined text-slate-500">notifications</span>
            <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full h-4 w-4 flex items-center justify-center">12</span>
          </div>
          <div class="flex items-center gap-2 border-l border-slate-200 pl-4 cursor-pointer">
            <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-bold">绿</div>
            <span class="text-sm text-slate-700">低碳运营员</span>
            <span class="material-symbols-outlined text-slate-400 text-[16px]">arrow_drop_down</span>
          </div>
        </div>
      </header>

      <section class="flex-1 min-h-0 relative" id="frame-shell">
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10" id="loading-mask">
          <div class="px-4 py-2 rounded bg-white border border-slate-200 shadow-sm text-sm text-slate-500">正在打开绿色核算模块...</div>
        </div>
        <iframe id="content-frame" title="绿色工厂碳核算模块内容"></iframe>
      </section>
    </main>
  </div>

  <script>
    const APP_VERSION = "20260722-shell2";
    const modules = {
      boundary: { title: "核算边界管理", url: "./boundary.html" },
      source: { title: "排放源管理", url: "./source.html" },
      datasource: { title: "数据源管理", url: "./datasource.html" },
      model: { title: "核算模型管理", url: "./model.html" },
      factor: { title: "因子库管理", url: "./factor.html" },
      standard: { title: "标准管理", url: "./standard.html" },
      gwp: { title: "GWP管理", url: "./gwp.html" }
    };

    const frame = document.getElementById("content-frame");
    const frameShell = document.getElementById("frame-shell");
    const loadingMask = document.getElementById("loading-mask");
    const titleNode = document.getElementById("current-title");
    const tabContainer = document.getElementById("sidebar-tabs");

    function switchModule(key) {
      const moduleKey = modules[key] ? key : "boundary";
      const module = modules[moduleKey];

      titleNode.textContent = module.title;
      tabContainer.querySelectorAll("[data-key]").forEach((button) => {
        button.classList.toggle("active", button.dataset.key === moduleKey);
      });

      frameShell.classList.add("frame-loading");
      loadingMask.classList.remove("hidden");
      frame.src = `${module.url}?v=${APP_VERSION}`;
      history.replaceState(null, "", "#" + moduleKey);
    }

    frame.addEventListener("load", () => {
      frameShell.classList.remove("frame-loading");
      loadingMask.classList.add("hidden");
    });

    tabContainer.addEventListener("click", (event) => {
      const button = event.target.closest("[data-key]");
      if (!button) return;
      switchModule(button.dataset.key);
    });

    window.addEventListener("hashchange", () => {
      switchModule((location.hash || "#boundary").slice(1));
    });

    switchModule((location.hash || "#boundary").slice(1));
  </script>
</body>
</html>
