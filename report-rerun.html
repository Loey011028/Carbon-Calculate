<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>碳排报表重跑</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="./eco-admin-theme.css" rel="stylesheet"/>
  <script src="./shared-mock-data.js"></script>
  <style>
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;line-height:1}
    html,body{height:100%}
    .rerun-shell{height:100vh;min-height:0;display:flex;flex-direction:column}
    .rerun-content{height:100%;flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 18px 18px;overflow:hidden}
    .rerun-pending-overview{margin-bottom:10px;padding:12px 14px}
    .rerun-overview-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px}
    .rerun-overview-table{border:1px solid var(--eco-line);border-radius:10px;overflow:hidden;background:var(--eco-paper)}
    .rerun-overview-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
    .rerun-overview-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .rerun-overview-row{display:grid;grid-template-columns:36px 48px minmax(132px,.95fr) minmax(124px,.78fr) minmax(128px,.84fr) minmax(128px,.84fr) minmax(96px,.62fr) minmax(110px,.75fr);gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--eco-line)}
    .rerun-overview-row>*{min-width:0}
    .rerun-overview-row:first-child{border-top:0}
    .rerun-overview-head{background:var(--eco-surface-container-low);font-size:12px;font-weight:800;color:var(--eco-muted)}
    .rerun-overview-value{font-size:13px;color:var(--eco-on-surface);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rerun-overview-change{font-size:12px;color:var(--eco-on-surface);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rerun-overview-index{font-size:13px;color:var(--eco-muted);font-weight:800;text-align:center}
    .rerun-overview-action{justify-self:center;text-align:center}
    .rerun-record-status-filters{display:flex;gap:8px;align-items:center;justify-content:flex-start;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;border:1px solid rgba(111,150,55,.18);border-radius:12px;background:linear-gradient(180deg,rgba(255,253,245,.92),rgba(244,241,231,.68))}
    .rerun-record-status-filter-wrap{position:relative;display:inline-flex;align-items:center}
    .rerun-record-status-filter{min-width:142px;height:34px;border:1px solid rgba(111,150,55,.32);border-radius:11px;background:var(--eco-paper);padding:0 10px 0 12px;font-size:13px;line-height:1;font-weight:750;color:var(--eco-green-900);box-shadow:inset 0 1px 0 rgba(255,255,255,.74),0 1px 3px rgba(23,63,39,.08);display:inline-flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .14s ease,box-shadow .14s ease,background .14s ease}
    .rerun-record-status-filter:hover{border-color:var(--eco-green-500);background:rgba(255,253,245,.98)}
    .rerun-record-status-filter:focus-visible{outline:none;border-color:var(--eco-green-500);box-shadow:0 0 0 3px rgba(111,150,55,.16),inset 0 1px 0 rgba(255,255,255,.74)}
    .rerun-record-status-filter .material-symbols-outlined{font-size:18px;transition:transform .14s ease}
    .rerun-record-status-filter[aria-expanded="true"] .material-symbols-outlined{transform:rotate(180deg)}
    .rerun-record-status-menu{position:absolute;z-index:40;left:0;top:calc(100% + 6px);min-width:100%;padding:6px;border:1px solid rgba(111,150,55,.24);border-radius:12px;background:var(--eco-paper);box-shadow:0 14px 30px rgba(23,63,39,.16)}
    .rerun-record-status-option{width:100%;min-height:31px;border:0;border-radius:8px;background:transparent;padding:7px 10px;text-align:left;color:var(--eco-on-surface);font-size:13px;font-weight:700;white-space:nowrap;transition:background .14s ease,color .14s ease}
    .rerun-record-status-option:hover,.rerun-record-status-option.active{background:var(--eco-sage-100);color:var(--eco-green-900)}
    .rerun-record-status{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:4px 9px;border:1px solid var(--eco-line);font-size:12px;font-weight:800;white-space:nowrap}
    .rerun-record-status.pending{background:var(--eco-paper);color:var(--eco-green-900)}
    .rerun-record-status.rerun{background:var(--eco-sage-100);border-color:rgba(47,111,61,.22);color:var(--eco-green-900)}
    .rerun-record-status.rerun:hover{border-color:var(--eco-green-500);background:rgba(215,230,195,.72)}
    .rerun-overview-empty{padding:18px 12px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(244,248,238,.72))}
    .rerun-overview-empty-card{grid-column:1/-1;display:grid;place-items:center;text-align:center;gap:6px;padding:16px;border:1px dashed rgba(111,150,55,.38);border-radius:12px;background:rgba(255,255,255,.72)}
    .rerun-overview-empty-icon{width:38px;height:38px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:rgba(215,230,195,.72);color:var(--eco-green-800)}
    .rerun-overview-empty-title{font-size:14px;font-weight:800;color:var(--eco-green-900)}
    .rerun-overview-empty-desc{font-size:12px;color:var(--eco-muted);font-weight:600}
    .rerun-overview-pagination{margin-top:6px}
    .rerun-view-panel{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .rerun-progress{height:8px;border-radius:999px;background:var(--eco-sage-100);overflow:hidden;border:1px solid var(--eco-line)}
    .rerun-progress span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--eco-green-500),var(--eco-green-700))}
    .rerun-table-progress{display:grid;gap:4px;min-width:0}
    .rerun-table-progress-text{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--eco-muted)}
    .rerun-task-content{display:grid;gap:3px;min-width:0}
    .rerun-task-content-title{font-size:13px;font-weight:800;color:var(--eco-on-surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rerun-task-content-points{font-size:12px;color:var(--eco-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .rerun-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
    .rerun-tab.active{background:var(--eco-green-900)!important;color:#fff!important;border-color:var(--eco-green-900)!important}
    .rerun-status-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .rerun-status-tab.active,.rerun-filter-tab.active{background:var(--eco-green-900)!important;color:#fff!important;border-color:var(--eco-green-900)!important}
    .rerun-filter-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .rerun-table-card{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .rerun-table-area{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;border:0!important;border-radius:0!important;box-shadow:none!important}
    .rerun-table-min{width:100%;min-width:0}
    .rerun-cell-wrap{white-space:normal;word-break:break-word;line-height:1.45}
    .rerun-action-buttons{display:flex;flex-wrap:nowrap;justify-content:center;gap:5px;white-space:nowrap}
    .rerun-action-buttons .eco-action-btn{min-width:46px;height:30px;border-radius:8px;font-weight:600;padding:0 8px}
    .rerun-compact-pagination{min-height:34px;padding:5px 12px!important}
    .rerun-compact-pagination .eco-btn-square-sm{width:28px!important;height:28px!important;min-height:28px!important}
    .rerun-compact-pagination .eco-pagination-summary{font-size:12px}
    .rerun-action-detail{border-color:var(--eco-line)!important;background:var(--eco-paper)!important;color:var(--eco-green-900)!important}
    .rerun-action-detail:hover{border-color:var(--eco-green-400)!important;background:var(--eco-sage-100)!important}
    .rerun-action-cancel{border-color:rgba(185,28,28,.28)!important;background:#fff5f5!important;color:#b91c1c!important}
    .rerun-action-cancel:hover{background:#fee2e2!important;border-color:rgba(185,28,28,.45)!important}
    .rerun-action-disabled{border-color:var(--eco-line)!important;background:var(--eco-surface-container-low)!important;color:var(--eco-muted)!important;cursor:not-allowed;opacity:.68}
    .rerun-detail-shell{display:grid;gap:16px}
    .rerun-detail-summary-line{display:flex;flex-wrap:wrap;gap:12px 34px;align-items:center;color:var(--eco-muted)}
    .rerun-detail-summary-line strong{color:var(--eco-on-surface)}
    .rerun-detail-label{font-size:12px;color:var(--eco-muted);font-weight:700}
    .rerun-detail-value{font-size:13px;color:var(--eco-on-surface);font-weight:800}
    .rerun-detail-status{font-weight:800}
    .rerun-detail-status.running,.rerun-detail-status.completed{color:var(--eco-green-700)!important}
    .rerun-detail-status.queued{color:var(--eco-olive-700,var(--eco-green-800))!important}
    .rerun-detail-status.failed,.rerun-detail-status.cancelled{color:var(--eco-muted)!important}
    .rerun-detail-content-line{display:flex;gap:8px;align-items:flex-start;line-height:1.55}
    .rerun-detail-content-line strong{font-size:13px;color:var(--eco-on-surface);font-weight:800}
    .rerun-change-detail-list{border:1px solid var(--eco-line);border-radius:10px;background:var(--eco-paper);overflow:hidden}
    .rerun-change-detail-row{display:grid;grid-template-columns:28px minmax(150px,1.1fr) minmax(140px,1fr) minmax(86px,.62fr) minmax(86px,.62fr) minmax(126px,.82fr);gap:10px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--eco-line)}
    .rerun-change-detail-row:last-child{border-bottom:0}
    .rerun-change-order{width:22px;height:22px;border-radius:999px;background:var(--eco-sage-100);color:var(--eco-green-900);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
    .rerun-change-label{font-size:12px;line-height:1.35;color:var(--eco-muted);font-weight:700;margin-bottom:3px}
    .rerun-change-text{min-width:0;font-size:13px;line-height:1.45;color:var(--eco-on-surface);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rerun-current-progress-card{border:1px solid var(--eco-line);border-left:4px solid var(--eco-green-700);border-radius:12px;background:rgba(245,250,238,.72);padding:14px 16px;display:grid;gap:10px}
    .rerun-current-progress-card.queued{border-left-color:var(--eco-line);background:var(--eco-paper)}
    .rerun-current-progress-card.completed{border-left-color:var(--eco-green-700)}
    .rerun-current-progress-title{font-size:14px;font-weight:800;color:var(--eco-green-900)}
    .rerun-current-progress-text{font-size:13px;color:var(--eco-muted);font-weight:700;line-height:1.55}
    .rerun-current-progress-text strong{color:var(--eco-green-900)}
    .rerun-detail-progress{height:8px;border-radius:999px;background:var(--eco-sage-100);overflow:hidden;border:1px solid var(--eco-line)}
    .rerun-detail-progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--eco-green-600),var(--eco-green-800))}
    .rerun-segment-list{border:1px solid var(--eco-line);border-radius:10px;background:var(--eco-paper);overflow:hidden}
    .rerun-segment-row{display:grid;grid-template-columns:22px minmax(170px,1fr) minmax(112px,.55fr) minmax(112px,.5fr);gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--eco-line);color:var(--eco-muted);font-size:13px}
    .rerun-segment-row:last-child{border-bottom:none}
    .rerun-segment-row.current{background:rgba(215,230,195,.3);color:var(--eco-green-900);box-shadow:inset 4px 0 0 var(--eco-green-700)}
    .rerun-segment-status-dot{width:9px;height:9px;border-radius:999px;background:var(--eco-line)}
    .rerun-segment-status-dot.completed{background:var(--eco-green-700)}
    .rerun-segment-status-dot.running{width:13px;height:13px;border:3px solid rgba(47,111,61,.18);background:var(--eco-green-700)}
    .rerun-segment-main{font-size:13px;font-weight:700;color:var(--eco-on-surface);font-family:inherit;letter-spacing:0}
    .rerun-segment-row.current .rerun-segment-main{color:var(--eco-green-900)}
    .rerun-segment-state{font-size:13px;font-weight:800;color:var(--eco-muted)}
    .rerun-segment-state.completed{color:var(--eco-green-700)}
    .rerun-segment-state.running{color:var(--eco-green-800)}
    .rerun-segment-time{text-align:right;color:var(--eco-muted);font-size:12px;font-weight:700}
    .rerun-detail-note{border:1px dashed rgba(111,150,55,.24);border-radius:10px;background:var(--eco-surface-container-low);padding:10px 12px;color:var(--eco-muted);font-size:12px;font-weight:700;line-height:1.5}
    @keyframes rerunFeedbackIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes rerunFeedbackOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-6px)}}
    .rerun-submit-feedback{position:absolute;right:18px;bottom:14px;z-index:20;max-width:min(520px,calc(100% - 36px));padding:10px 14px;border:1px solid rgba(47,111,61,.22);border-radius:12px;background:rgba(245,250,238,.96);color:var(--eco-green-900);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 12px 28px rgba(23,63,39,.14);backdrop-filter:blur(6px);animation:rerunFeedbackIn .22s ease-out both;pointer-events:none}
    .rerun-submit-feedback.exiting{animation:rerunFeedbackOut .2s ease-in both}
    .rerun-submit-feedback.hidden{display:none}
    .rerun-row-running td{background:rgba(215,230,195,.22)!important}
    .rerun-row-running td:first-child{box-shadow:inset 4px 0 0 var(--eco-green-700)}
    @keyframes rerunTaskFlash{0%{background:rgba(255,245,190,.72)}65%{background:rgba(255,245,190,.24)}100%{background:transparent}}
    @keyframes rerunTaskFlashFirst{0%{box-shadow:inset 0 0 0 999px rgba(255,245,190,.2)}100%{box-shadow:none}}
    .rerun-row-flash td{animation:rerunTaskFlash 1.4s ease-out 1}
    .rerun-row-flash td:first-child{animation:rerunTaskFlash 1.4s ease-out 1,rerunTaskFlashFirst 1.4s ease-out 1}
    .rerun-confirm-card{width:560px;max-width:92vw;overflow:hidden}
    .rerun-confirm-body{padding:20px 24px;display:grid;gap:12px}
    .rerun-confirm-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .rerun-confirm-item{border:1px solid var(--eco-line);border-radius:10px;background:var(--eco-paper);padding:10px 12px;min-width:0}
    .rerun-confirm-label{font-size:12px;font-weight:700;color:var(--eco-muted);margin-bottom:4px}
    .rerun-confirm-value{font-size:14px;font-weight:800;color:var(--eco-on-surface);word-break:break-word}
    .rerun-confirm-note{border:1px solid rgba(111,150,55,.22);border-radius:10px;background:rgba(215,230,195,.34);padding:10px 12px;color:var(--eco-green-900);font-size:13px;font-weight:700}
    .rerun-form-select,.rerun-form-input{border-radius:14px!important;background-color:var(--eco-paper)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.74)!important;font-weight:600!important}
    .rerun-select-wrap{position:relative}
    .rerun-select-wrap::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--eco-green-700);border-bottom:2px solid var(--eco-green-700);transform:translateY(-65%) rotate(45deg);pointer-events:none}
    .rerun-select-wrap .eco-select{padding-right:40px!important;background-image:none!important}
    .rerun-select-wrap select[multiple]{padding-right:12px!important}
    .rerun-select-wrap:has(select[multiple])::after{display:none}
    .rerun-scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
    .rerun-pending-status{font-size:12px;color:var(--eco-muted);white-space:nowrap}
    .rerun-pending-chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .rerun-pending-chip{max-width:100%;border:1px solid rgba(111,150,55,.28);border-radius:12px;background:rgba(255,255,255,.74);padding:10px 12px}
    .rerun-pending-chip-name{font-size:14px;font-weight:800;color:var(--eco-green-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rerun-pending-chip-meta{margin-top:3px;font-size:12px;color:var(--eco-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rerun-pending-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .rerun-pending-tag{display:inline-flex;align-items:center;gap:6px;max-width:210px;padding:5px 10px;border:1px solid rgba(111,150,55,.28);border-radius:999px;background:var(--eco-paper);color:var(--eco-green-900);font-size:12px;font-weight:700}
    .rerun-pending-tag span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rerun-pending-overflow{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:var(--eco-surface-container-low);color:var(--eco-muted);font-size:12px;font-weight:700}
    .rerun-pending-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
    .rerun-pending-summary-item{border:1px solid var(--eco-line);border-radius:10px;background:var(--eco-paper);padding:9px 10px}
    .rerun-pending-summary-label{font-size:12px;color:var(--eco-muted);font-weight:700;margin-bottom:2px}
    .rerun-pending-summary-value{font-size:15px;color:var(--eco-green-900);font-weight:800}
    .rerun-pending-batch{border:1px solid rgba(111,150,55,.22);border-radius:12px;background:rgba(255,255,255,.64);padding:12px}
    .rerun-current-pending-empty{border:1px dashed rgba(111,150,55,.28);border-radius:12px;background:var(--eco-surface-container-low);padding:12px;color:var(--eco-muted)}
    .rerun-pending-batch-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .rerun-pending-batch-pill{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(111,150,55,.24);border-radius:999px;background:var(--eco-sage-100);padding:3px 8px;color:var(--eco-green-900);font-weight:700}
    .rerun-pending-table{border:1px solid var(--eco-line);border-radius:10px;overflow:hidden;background:var(--eco-paper)}
    .rerun-pending-row{display:grid;grid-template-columns:minmax(160px,1.2fr) minmax(96px,.75fr) minmax(150px,1fr) minmax(128px,.85fr);gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--eco-line)}
    .rerun-pending-row:first-child{border-top:0}
    .rerun-pending-head{font-size:12px;font-weight:800;color:var(--eco-muted);background:var(--eco-surface-container-low);padding-top:8px;padding-bottom:8px}
    .rerun-pending-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--eco-on-surface)}
    .rerun-pending-value.primary{font-weight:800;color:var(--eco-green-900)}
    .rerun-pending-simple-list{display:grid;gap:8px}
    .rerun-pending-simple-item{border:1px solid var(--eco-line);border-radius:10px;background:var(--eco-paper);padding:9px 10px}
    .rerun-pending-simple-name{font-size:14px;font-weight:800;color:var(--eco-green-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rerun-pending-simple-meta{margin-top:3px;font-size:12px;color:var(--eco-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rerun-check-tree{min-height:112px;max-height:280px;overflow:auto;border:1px solid var(--eco-line);border-radius:12px;background:var(--eco-paper);padding:10px}
    .rerun-tree-group{border-bottom:1px solid var(--eco-line);padding:10px 0 12px}
    .rerun-tree-group:last-child{border-bottom:0}
    .rerun-tree-parent,.rerun-tree-child,.rerun-tree-item{display:flex;align-items:center;gap:10px;line-height:1.45;border-radius:8px}
    .rerun-tree-parent{font-weight:700;color:var(--eco-green-900);padding:8px 10px;background:rgba(215,230,195,.45);border:1px solid rgba(111,150,55,.22)}
    .rerun-tree-label{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
    .rerun-tree-label-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rerun-tree-toggle{width:24px;height:24px;flex:0 0 auto;border:1px solid rgba(111,150,55,.28);border-radius:8px;background:var(--eco-paper);color:var(--eco-green-900);display:inline-flex;align-items:center;justify-content:center;transition:.16s ease}
    .rerun-tree-toggle:hover{border-color:var(--eco-green-400);background:var(--eco-sage-100)}
    .rerun-tree-toggle .material-symbols-outlined{font-size:20px;transition:transform .16s ease}
    .rerun-tree-toggle[aria-expanded="false"] .material-symbols-outlined{transform:rotate(-90deg)}

<script>
const MAX_QUEUE_SIZE = 5;
const RERUN_SEGMENT_DAYS = 30;
const PAGE_SIZE = 6;
const OVERVIEW_PAGE_SIZE = 2;
const Mock = window.CarbonAccountingMock || {};
const storageKey = "carbon-report-rerun-tasks-v3";
const pendingStateStorageKey = "carbon-report-rerun-pending-state-v1";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const statusText = { queued: "排队中", running: "执行中", completed: "已完成", failed: "失败", cancelled: "已取消" };
const statusClass = { queued: "eco-tag-warning", running: "eco-tag-info", completed: "eco-tag-success", failed: "eco-tag-danger", cancelled: "eco-tag-muted" };
const stages = ["校验闭环与标准", "计算点位小时", "汇总日表", "汇总空间与月表", "写入报表结果"];
const activeTaskStatuses = new Set(["queued", "running", "completed"]);
let activeStatus = "current";
let pendingCancelTaskId = null;
let currentPage = 1;
let overviewPage = 1;
let pendingDraft = null;
let currentSelectedPendingRecords = [];
let selectedPendingRecordKeys = new Set();
const pendingRecordState = loadPendingRecordState();
let cancelledPendingRecordKeys = new Set(pendingRecordState.cancelledKeys || []);
let activeRecordStatus = "all";
let focusedTaskId = "";
let focusedTaskTimer = null;
let submitFeedbackTimer = null;
let activeDetailTaskId = "";
let lastStartedTaskId = "";
const defaultTasks = [];
let tasks = loadTasks();

function loadTasks() {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
    return Array.isArray(saved) ? saved : defaultTasks.slice();
  } catch (error) {
    return defaultTasks.slice();
  }
}
function saveTasks() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(tasks));
    window.__rerunStorageAvailable = true;
  } catch (error) {
    window.__rerunStorageAvailable = false;
  }
}
function loadPendingRecordState() {
  try {
    const saved = JSON.parse(localStorage.getItem(pendingStateStorageKey) || "{}");
    return {
      cancelledKeys: Array.isArray(saved.cancelledKeys) ? saved.cancelledKeys : []
    };
  } catch (error) {
    return { cancelledKeys: [] };
  }
}
function savePendingRecordState() {
  try {
    localStorage.setItem(pendingStateStorageKey, JSON.stringify({
      cancelledKeys: Array.from(cancelledPendingRecordKeys)
    }));
    window.__rerunPendingStateStorageAvailable = true;
  } catch (error) {
    window.__rerunPendingStateStorageAvailable = false;
  }
}
function optionHtml(items) {
  return items.map((item) => `<option value="${esc(item.value)}">${esc(item.label)}</option>`).join("");
}
function renderCheckboxTree(targetId, groups, emptyText) {
  const target = $(targetId);
  if (!groups.length) {
    target.innerHTML = `<div class="eco-muted-text p-2">${esc(emptyText)}</div>`;
    return;
  }
  target.innerHTML = groups.map((group, groupIndex) => {
    const children = group.children || [];
    return `<div class="rerun-tree-group"><label class="rerun-tree-parent"><input class="eco-checkbox" type="checkbox" data-tree-parent="${targetId}-${groupIndex}"/>${esc(group.label)}<span class="eco-muted-text">(${children.length})</span></label>${children.map((item) => `<label class="rerun-tree-child"><input class="eco-checkbox" type="checkbox" data-tree-child="${targetId}-${groupIndex}" value="${esc(item.value)}"/>${esc(item.label)}</label>`).join("")}</div>`;
  }).join("");
}
function selectedCheckedValues(targetId) {
  return Array.from($(targetId).querySelectorAll("input[data-tree-parent]:checked,input[data-tree-child]:checked,input[data-tree-leaf]:checked"))
    .filter((item) => item.value)
    .map((item) => item.value);
}
function treeSearchText(id) {
  return String($(id)?.value || "").trim().toLowerCase();
}
function matchesTreeSearch(item, keyword) {
  if (!keyword) return true;
  return [item.value, item.label, item.searchText].some((value) => String(value || "").toLowerCase().includes(keyword));
}
function syncTreeParentState(targetId, groupKey) {
  const parent = $(targetId).querySelector(`input[data-tree-parent="${groupKey}"]`);
  const children = Array.from($(targetId).querySelectorAll(`input[data-tree-child="${groupKey}"]`));
  if (!parent || !children.length) return;
  const checked = children.filter((item) => item.checked).length;
  parent.checked = checked === children.length;
  parent.indeterminate = checked > 0 && checked < children.length;
}
function renderEmissionSourceDataTree(targetId, groups, emptyText) {
  const target = $(targetId);
  if (!groups.length) {
    target.innerHTML = `<div class="eco-muted-text p-2">${esc(emptyText)}</div>`;
    return;
  }
  target.innerHTML = groups.map((group, groupIndex) => {
    const groupKey = `${targetId}-category-${groupIndex}`;
    return `<div class="rerun-tree-group"><div class="rerun-tree-parent"><button class="rerun-tree-toggle" type="button" data-tree-toggle="${groupKey}" aria-expanded="true" aria-label="展开或折叠${esc(group.label)}"><span class="material-symbols-outlined">expand_more</span></button><label class="rerun-tree-label"><input class="eco-checkbox" type="checkbox" data-tree-parent="${groupKey}" value="${esc(group.value || group.label)}"/><span class="rerun-tree-label-text">${esc(group.label)}</span><span class="eco-muted-text">(${group.children.length})</span></label></div><div class="rerun-tree-branch" data-tree-branch="${groupKey}">${group.children.map((source, sourceIndex) => {
      const sourceKey = `${groupKey}-source-${sourceIndex}`;
      const dataSources = source.dataSources || [];
      return `<div><div class="rerun-tree-child rerun-tree-source-node"><button class="rerun-tree-toggle" type="button" data-tree-toggle="${sourceKey}" aria-expanded="true" aria-label="展开或折叠${esc(source.label)}"><span class="material-symbols-outlined">expand_more</span></button><label class="rerun-tree-label"><input class="eco-checkbox" type="checkbox" data-tree-child="${groupKey}" data-tree-source="${sourceKey}" value="${esc(source.value)}"/><span class="rerun-tree-label-text">${esc(source.label)}</span><span class="eco-muted-text">(${dataSources.length})</span></label></div><div data-tree-branch="${sourceKey}">${dataSources.map((item) => `<div class="rerun-tree-child rerun-tree-grandchild" aria-disabled="true"><span class="rerun-tree-datasource-dot"></span><span class="rerun-tree-label-text">${esc(item.label)}</span></div>`).join("")}</div></div>`;
    }).join("")}</div></div>`;
  }).join("");
}
function dataSourceRows() {
  return (Mock.DataSources || []).filter((item) => item && item.status !== "已删除");
}
function sourceDataSources(source) {
  const ids = new Set((source?.datasourceIds || []).map((id) => String(id)));
  return dataSourceRows()
    .filter((item) => ids.has(String(item.id)))
    .map((item) => ({ value: `数据源：${item.name || item.id || ""}`, label: item.name || item.id || "", searchText: `${item.name || ""} ${item.type || ""} ${item.sourceType || ""} ${item.dataType || ""}` }));
}
function currentEnabledStandard() {
  const rows = Mock.getStandardFiles?.() || Mock.StandardFiles || [];
  return rows.find((item) => item && item.enabled === true) || null;
}
function standardLabel(item) {
  return item?.standardName || item?.name || item?.fileName || item?.id || "";
}
function standardOptions() {
  const rows = Mock.getStandardFiles?.() || Mock.StandardFiles || [];
  return rows.filter((item) => item && item.status !== "已删除" && item.status !== "已归档")
    .map((item) => ({ value: standardLabel(item), label: `${standardLabel(item)}${item.enabled === true ? "（当前启用）" : ""}`, enabled: item.enabled === true }))
    .filter((item) => item.value);
}
function renderStandardOptions() {
  const standard = currentEnabledStandard();
  const enabledName = standardLabel(standard);
  const options = standardOptions();
  $("rerun-standard-select").innerHTML = optionHtml(options.length ? options : [{ value: "", label: "未找到可用标准" }]);
  $("rerun-standard-select").value = enabledName || options[0]?.value || "";
}
function selectStandardOption(standard) {
  const select = $("rerun-standard-select");
  const option = Array.from(select.options).find((item) => standardMatches(item.value, standard));
  if (option) select.value = option.value;
}
function boundaryCategoryOptionsForTree() {

  const modal = $("rerun-detail-modal");
  if (!activeDetailTaskId || modal?.classList.contains("hidden")) return;
  const nextId = lastStartedTaskId || activeDetailTaskId;
  const task = tasks.find((item) => item.id === nextId);
  if (!task) return;
  lastStartedTaskId = "";
  showDetail(task.id);
}
function focusCurrentSegmentInDetail() {
  const segment = $("rerun-detail-body")?.querySelector("[data-current-segment]");
  if (!segment) return;
  requestAnimationFrame(() => segment.scrollIntoView({ behavior: "smooth", block: "center" }));
}

function closeRecordStatusMenus(except = null) {
  document.querySelectorAll("[data-rerun-record-status-filter]").forEach((wrap) => {
    if (except && wrap === except) return;
    wrap.querySelector("[data-rerun-record-status-menu]")?.classList.add("hidden");
    wrap.querySelector("[data-rerun-record-status-toggle]")?.setAttribute("aria-expanded", "false");
  });
}
$("submit-rerun-task").onclick = submitDraft;
document.addEventListener("click", (event) => {
  const statusToggle = event.target.closest("[data-rerun-record-status-toggle]");
  if (statusToggle) {
    const wrap = statusToggle.closest("[data-rerun-record-status-filter]");
    const menu = wrap?.querySelector("[data-rerun-record-status-menu]");
    const willOpen = menu?.classList.contains("hidden");
    closeRecordStatusMenus(willOpen ? wrap : null);
    if (menu) menu.classList.toggle("hidden", !willOpen);
    statusToggle.setAttribute("aria-expanded", willOpen ? "true" : "false");
    return;
  }
  const statusOption = event.target.closest("[data-rerun-record-status-option]");
  if (statusOption) {
    activeRecordStatus = statusOption.dataset.rerunRecordStatusOption || "all";
    overviewPage = 1;
    closeRecordStatusMenus();
    renderPendingOverview();
    return;
  }
  if (!event.target.closest("[data-rerun-record-status-filter]")) closeRecordStatusMenus();
  const recordFocusBtn = event.target.closest("[data-pending-record-focus]");
  if (recordFocusBtn) focusTaskFromPendingRecord(recordFocusBtn.dataset.pendingRecordFocus);
  const recordRow = event.target.closest("[data-pending-record-row]");
  if (recordRow && !event.target.closest("button,input,label,.rerun-record-check-cell")) {
    const record = pendingRerunSourceRecords().find((item) => item.key === recordRow.dataset.pendingRecordRow);
    if (record && recordRerunStatus(record) === "rerun") focusTaskFromPendingRecord(record.key);
  }
  const recordRerunBtn = event.target.closest("[data-pending-record-rerun]");
  if (recordRerunBtn) openCreateModal(recordRerunBtn.dataset.pendingRecordRerun);
  const selectedRerunBtn = event.target.closest("[data-pending-selected-rerun]");
  if (selectedRerunBtn) openCreateModal();
  const recordCancelBtn = event.target.closest("[data-pending-record-cancel]");
  if (recordCancelBtn) cancelPendingRecords([recordCancelBtn.dataset.pendingRecordCancel]);
});
document.querySelectorAll("[data-close-task-modal]").forEach((btn) => btn.onclick = () => setModal("rerun-task-modal", false));
document.querySelectorAll("[data-close-detail]").forEach((btn) => btn.onclick = () => {
  activeDetailTaskId = "";
  setModal("rerun-detail-modal", false);
});
document.querySelectorAll("[data-close-cancel]").forEach((btn) => btn.onclick = () => setModal("rerun-cancel-modal", false));
$("confirm-cancel-task").onclick = confirmCancelTask;
document.querySelectorAll('input[name="scopeType"]').forEach((input) => input.onchange = renderScopePanels);
["rerun-date-start", "rerun-date-end"].forEach((id) => {
  $(id).addEventListener("input", refreshPendingAndEstimate);
  $(id).addEventListener("change", refreshPendingAndEstimate);
});
if ($("rerun-source-search")) $("rerun-source-search").oninput = () => { renderEmissionSourceOptions(); updateEstimate(); };
if ($("rerun-standard-select")) $("rerun-standard-select").onchange = refreshPendingAndEstimate;
if ($("rerun-source-tree")) $("rerun-source-tree").addEventListener("change", handleTreeChange);
if ($("rerun-source-tree")) $("rerun-source-tree").addEventListener("click", handleTreeToggle);
$("rerun-prev-page").onclick = () => { currentPage -= 1; renderTable(); };
$("rerun-next-page").onclick = () => { currentPage += 1; renderTable(); };
$("rerun-overview-prev-page").onclick = () => { overviewPage -= 1; renderPendingOverview(); };
$("rerun-overview-next-page").onclick = () => { overviewPage += 1; renderPendingOverview(); };
$("rerun-task-body").addEventListener("click", (event) => {
  const btn = event.target.closest("[data-action]");
  if (!btn) return;
  if (btn.dataset.action === "detail") showDetail(btn.dataset.id);
  if (btn.dataset.action === "cancel") openCancelModal(btn.dataset.id);
});
document.addEventListener("click", (event) => {
  const simulateStep = event.target.closest("[data-simulate-run-step]");
  if (simulateStep) {
    simulateRunningTaskStep();
    return;
  }
  const simulateComplete = event.target.closest("[data-simulate-complete-running]");
  if (simulateComplete) {
    simulateCompleteRunningTask();
    return;
  }
  const statusBtn = event.target.closest("[data-status-tab]");
  if (statusBtn) {
    activeStatus = statusBtn.dataset.statusTab;
    currentPage = 1;
    renderTable();
  }
});
document.addEventListener("change", (event) => {
  const recordCheckbox = event.target.closest("[data-pending-record-select]");
  if (recordCheckbox) setPendingRecordSelection(recordCheckbox.dataset.pendingRecordSelect, recordCheckbox.checked);
  const selectAll = event.target.closest("#rerun-pending-select-all");
  if (selectAll) {
    pendingRecordKeysOnPage().forEach((key) => {
      if (selectAll.checked) selectedPendingRecordKeys.add(key);
      else selectedPendingRecordKeys.delete(key);
    });
    renderPendingOverview();
  }
});
function handleSharedMockUpdate() {
  renderSharedOptions();
  renderScopePanels();
  renderPendingOverview();
  renderTable();
}
function focusPendingRerunRecords() {
  activeRecordStatus = "all";
  overviewPage = 1;
  selectedPendingRecordKeys.clear();
  handleSharedMockUpdate();
  $("rerun-pending-overview")?.scrollIntoView({ behavior: "smooth", block: "start" });
}
function startNextQueuedTask() {
  const nextTask = tasks.find((item) => item.status === "queued");
  if (!nextTask) return false;
  nextTask.status = "running";
  nextTask.startedAt = "刚刚";
  lastStartedTaskId = nextTask.id;
  if (activeDetailTaskId) activeDetailTaskId = nextTask.id;
  if (Array.isArray(nextTask.segments) && nextTask.segments.length) {
    nextTask.segments.forEach((segment, index) => {
      segment.status = index === 0 ? "running" : "queued";
      segment.progress = index === 0 ? Math.max(3, Number(segment.progress || 0)) : 0;
      if (index === 0) segment.updatedAt = "刚刚";
    });
    nextTask.progress = taskProgressFromSegments(nextTask.segments);
    nextTask.processed = taskProcessedFromSegments(nextTask.segments);
  } else {
    nextTask.progress = Math.max(3, Number(nextTask.progress || 0));
  }
  focusedTaskId = nextTask.id;
  activeStatus = "current";
  const rows = filteredTasks();
  const index = rows.findIndex((item) => item.id === nextTask.id);
  currentPage = index >= 0 ? Math.floor(index / PAGE_SIZE) + 1 : currentPage;
  return true;
}
function advanceRunningTask() {
  const task = runningTask();
  if (!task) return false;
  const segments = Array.isArray(task.segments) ? task.segments : [];
  if (!segments.length) {
    if (task.progress >= 96) return false;
    task.progress += 1;
    task.stageIndex = Math.min(stages.length - 1, Math.floor(task.progress / 24));
    return true;
  }
  let activeIndex = segments.findIndex((segment) => segment.status === "running");
  if (activeIndex < 0) activeIndex = segments.findIndex((segment) => segment.status === "queued");
  if (activeIndex < 0) {
    task.status = "completed";
    task.progress = 100;
    task.endedAt = "刚刚";
    task.processed = taskProcessedFromSegments(segments);
    startNextQueuedTask();
    return true;
  }
  segments[activeIndex].status = "running";
  segments[activeIndex].progress = Math.min(100, Number(segments[activeIndex].progress || 0) + 18);
  if (segments[activeIndex].progress >= 100) {
    segments[activeIndex].status = "completed";
    segments[activeIndex].completedAt = "刚刚";
    const nextIndex = segments.findIndex((segment) => segment.status === "queued");
    if (nextIndex >= 0) {
      segments[nextIndex].status = "running";
      segments[nextIndex].progress = Math.max(3, Number(segments[nextIndex].progress || 0));
      segments[nextIndex].updatedAt = "刚刚";
    } else {
      task.status = "completed";
      task.endedAt = "刚刚";
      task.result = task.result || `已按 ${segments.length} 个时间分段完成重算`;
      startNextQueuedTask();
    }
  }
  task.progress = task.status === "completed" ? 100 : taskProgressFromSegments(segments);
  task.stageIndex = Math.min(stages.length - 1, Math.floor(task.progress / 24));
  task.processed = taskProcessedFromSegments(segments);
  return true;
}
function simulateRunningTaskStep() {
  if (!advanceRunningTask()) return false;
  saveTasks();
  renderTable();
  syncOpenTaskDetail();
  return true;
}
function simulateCompleteRunningTask() {
  const task = runningTask();
  if (!task) return false;
  let guard = 0;
  while (runningTask()?.id === task.id && guard < 40) {
    advanceRunningTask();
    guard += 1;
  }
  saveTasks();
  renderTable();
  syncOpenTaskDetail();
  return true;
}
window.addEventListener("message", (event) => {
  if (event.data?.type !== "carbon-mock-updated") return;
  if (event.data?.focusPending) focusPendingRerunRecords();
  else handleSharedMockUpdate();
});
window.addEventListener("carbon-mock-updated", handleSharedMockUpdate);
window.addEventListener("storage", (event) => {
  if (event.key === Mock.STORAGE_KEY) handleSharedMockUpdate();
});
setInterval(() => {
  simulateRunningTaskStep();
}, 5000);
renderSharedOptions();
renderScopePanels();
renderTable();
</script>
</body>
</html>
