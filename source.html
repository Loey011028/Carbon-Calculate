</div><script>
  const Mock = window.CarbonAccountingMock || {};
  const emissionCategoryTree = Mock.EmissionCategoryTree || [];
  const factorBuiltinCategoryTree = Mock.getFactorBuiltinCategoryTree?.() || Mock.FactorBuiltinCategoryTree || [];
  var sourceManagedCategoryTree = [];

  function getGroupNode(groupCode) {
    if (Array.isArray(sourceManagedCategoryTree)) {
      const managedGroup = sourceManagedCategoryTree.find(group => group.groupCode === groupCode);
      if (managedGroup) return managedGroup;
    }
    return factorBuiltinCategoryTree.find(group => group.groupCode === groupCode)
      || emissionCategoryTree.find(group => group.groupCode === groupCode)
      || null;
  }

  function getCategoryNode(categoryCode) {
    if (Array.isArray(sourceManagedCategoryTree)) {
      for (const group of sourceManagedCategoryTree) {
        const category = (group.children || []).find(item => item.category === categoryCode);
        if (category) return { group, category };
      }
    }
    for (const group of factorBuiltinCategoryTree) {
      const category = (group.children || []).find(item => item.category === categoryCode);
      if (category) return { group, category };
    }
    for (const group of emissionCategoryTree) {
      const category = (group.children || []).find(item => item.category === categoryCode);
      if (category) return { group, category };
    }
    return { group: null, category: null };
  }

  function getDatasourceNames(datasourceIds = []) {
    return datasourceIds
      .map(id => (Mock.DataSources || []).find(ds => ds.id === id))
      .filter(Boolean)
      .map(item => item.name)
      .join('、') || '待绑定';
  }

  function normalizeSourceStatus(status) {
    return status === '停用' ? '停用' : '启用';
  }

  function sharedSourceToRow(source) {
    const datasources = Mock.getDatasourceByIds?.(source.datasourceIds || []) || [];
    const firstDatasource = datasources[0];
    const sourceCategory = source.categoryCode || source.category || "";
    const categoryNode = getCategoryNode(sourceCategory);
    const groupInfo = Mock.getFactorCategoryGroupByCategory?.(sourceCategory) || Mock.getEmissionGroupByCategory?.(Mock.toAccountingCategoryCode?.(sourceCategory) || sourceCategory) || {};
    const accountingCategory = Mock.toAccountingCategoryCode?.(sourceCategory) || sourceCategory;
    const inferredScope = source.scope || Mock.inferScopeByCategory?.(accountingCategory) || '';
    const categoryLabel = source.categoryLabel || categoryNode?.category?.categoryLabel || Mock.toCategoryLabel?.(source.category) || source.category || '';
    return {
      ...source,
      groupCode: source.groupCode || categoryNode?.group?.groupCode || groupInfo.groupCode || '',
      groupLabel: source.groupLabel || categoryNode?.group?.groupLabel || groupInfo.groupLabel || '',
      scopeCode: inferredScope,
      belongingCategoryCode: source.belongingCategoryCode || source.belongingCategory || '',
      belongingCategoryLabel: source.belongingCategoryLabel || '',
      categoryCode: sourceCategory,
      scope: Mock.toScopeLabel?.(inferredScope) || inferredScope || '待推导',
      boundaryCategory: categoryLabel,
      category: categoryLabel,
      dataSources: String(datasources.length),
      datasourceIds: datasources.map(item => item.id),
      datasourceNames: getDatasourceNames(source.datasourceIds || []),
      org: source.org || firstDatasource?.org || '',
      unit: source.unit || firstDatasource?.unit || '',
      activityDataType: source.activityDataType || firstDatasource?.activityDataType || '',
      activityDataTypeLabel:
        source.activityDataTypeLabel ||
        source.activityDataLabel ||
        firstDatasource?.activityDataTypeLabel ||
        firstDatasource?.activityDataLabel ||
        firstDatasource?.dataTypeLabel ||
        firstDatasource?.categoryLabel ||
        Mock.getActivityDataLabel?.(source.activityDataType || firstDatasource?.activityDataType) ||
        '',
      activityDataLabel:
        source.activityDataLabel ||
        source.activityDataTypeLabel ||
        firstDatasource?.activityDataLabel ||
        firstDatasource?.activityDataTypeLabel ||
        firstDatasource?.dataTypeLabel ||
        firstDatasource?.categoryLabel ||
        Mock.getActivityDataLabel?.(source.activityDataType || firstDatasource?.activityDataType) ||
        '',
      accountingParams: source.accountingParams || {},
      accountingParamLabels: source.accountingParamLabels || {},
      status: normalizeSourceStatus(source.status)
    };

  function mergeSourceManagedCategoryTrees(...trees) {
    const map = new Map();
    trees.flat().forEach(group => {
      if (!group?.groupCode) return;
      if (isSourceManagedCategoryDeleted(group.groupCode)) return;
      if (!map.has(group.groupCode)) {
        map.set(group.groupCode, {
          groupCode: group.groupCode,
          groupLabel: group.groupLabel || group.groupCode,
          children: [],
          isCustom: Boolean(group.isCustom)
        });
      }
      const target = map.get(group.groupCode);
      (group.children || []).forEach(category => {
        const categoryCode = category.category || category.categoryCode;
        if (!categoryCode || target.children.some(item => item.category === categoryCode)) return;
        if (isSourceManagedCategoryDeleted(group.groupCode, categoryCode)) return;
        target.children.push({
          category: categoryCode,
          categoryCode,
          categoryLabel: category.categoryLabel || category.label || categoryCode,
          scope: category.scope || Mock.inferScopeByCategory?.(categoryCode) || "scope3",
          scopeLabel: category.scopeLabel || Mock.toScopeLabel?.(category.scope || "scope3") || "范围三",
          isCustom: Boolean(category.isCustom)
        });
      });
    });
    return Array.from(map.values());

  function updateEcoSelectControl(select) {
    const shell = select.closest('[data-eco-select-shell]');
    const label = shell?.querySelector('[data-eco-select-value-label]');
    const control = shell?.querySelector('[data-eco-select-control]');
    if (label) label.textContent = select.options[select.selectedIndex]?.textContent || '';
    if (control) control.disabled = select.disabled;
  }

  function openEcoSelectMenu(select) {
    if (!select || select.disabled) return;
    const shell = select.closest('[data-eco-select-shell]');
    const control = shell?.querySelector('[data-eco-select-control]');
    if (!shell || !control) return;
    const wasOpen = control.getAttribute('aria-expanded') === 'true';
    closeEcoSelectMenu();
    if (wasOpen) return;

    const rect = control.getBoundingClientRect();
    const viewportMargin = 8;
    const menuGap = 6;
    const menu = document.createElement('div');
    menu.dataset.ecoSelectMenu = 'true';
    menu.className = 'eco-select-menu';
    menu.style.left = `${Math.min(Math.max(viewportMargin, rect.left), Math.max(viewportMargin, window.innerWidth - rect.width - viewportMargin))}px`;
    menu.style.width = `${rect.width}px`;
    menu.innerHTML = Array.from(select.options).map(option =>
      `<button type="button" class="eco-select-option" data-eco-select-value="${escapeHtml(option.value)}" aria-selected="${option.selected ? 'true' : 'false'}">${escapeHtml(option.textContent)}</button>`
    ).join('');
    menu.addEventListener('click', event => {
      const option = event.target.closest('[data-eco-select-value]');
      if (!option) return;
      select.value = option.dataset.ecoSelectValue || '';
      updateEcoSelectControl(select);
      closeEcoSelectMenu();
      select.dispatchEvent(new Event('change', { bubbles: true }));
    });
    document.body.appendChild(menu);

    const belowSpace = window.innerHeight - rect.bottom - viewportMargin;
    const aboveSpace = rect.top - viewportMargin;
    const preferredHeight = Math.min(menu.scrollHeight, 240);
    const openUp = belowSpace < preferredHeight && aboveSpace > belowSpace;
    const availableSpace = Math.max(120, openUp ? aboveSpace : belowSpace);
    const menuHeight = Math.min(preferredHeight, availableSpace);
    menu.dataset.placement = openUp ? 'top' : 'bottom';
    menu.style.maxHeight = `${menuHeight}px`;
    menu.style.top = `${openUp
      ? Math.max(viewportMargin, rect.top - menuHeight - menuGap)
      : Math.min(rect.bottom + menuGap, window.innerHeight - menuHeight - viewportMargin)}px`;
    control.setAttribute('aria-expanded', 'true');
  }

  function enhanceEcoSelects(root = document) {
    root.querySelectorAll('select.eco-select:not([data-eco-select-enhanced])').forEach(select => {
      if (select.classList.contains('hidden')) return;
      select.dataset.ecoSelectEnhanced = 'true';
      const shell = document.createElement('div');
      const passthrough = ['eco-filter-select', 'eco-filter-select-sm', 'eco-page-size', 'eco-control-sm', 'eco-control-md', 'h-11', 'h-9', 'min-h-11', 'min-h-9', 'w-full'];
      const classes = Array.from(select.classList).filter(name =>
        /^!?w-/.test(name) ||
        /^!?min-w-/.test(name) ||
        /^!?max-w-/.test(name) ||
        passthrough.includes(name)
      );
      if (!classes.some(name => name.includes('filter') || name.includes('page-size') || /^!?w-/.test(name))) {
        classes.push('w-full');
      }
      shell.className = `eco-select-shell ${classes.join(' ')}`.trim();
      shell.dataset.ecoSelectShell = 'true';
      select.parentNode.insertBefore(shell, select);
      shell.appendChild(select);
      select.classList.add('eco-select-native');

      const control = document.createElement('button');
      control.type = 'button';
      control.className = 'eco-select-control';
      control.dataset.ecoSelectControl = 'true';
      control.innerHTML = '<span class="eco-select-value" data-eco-select-value-label></span><span class="eco-select-arrow" aria-hidden="true"></span>';
      shell.insertBefore(control, select);
      control.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        openEcoSelectMenu(select);
      });
      select.addEventListener('change', () => updateEcoSelectControl(select));
      updateEcoSelectControl(select);
    });
  }

  function syncEcoSelects(root = document) {
    enhanceEcoSelects(root);
    root.querySelectorAll('select.eco-select[data-eco-select-enhanced]').forEach(updateEcoSelectControl);
  }

  function setInlineCustomInput(select, input, isCustom) {
    const shell = select?.closest('[data-eco-select-shell]');
    shell?.classList.toggle('hidden', Boolean(isCustom));
    select?.classList.toggle('hidden', Boolean(isCustom));
    input?.classList.toggle('hidden', !isCustom);
    if (input) input.disabled = !isCustom;
    if (isCustom) {
      window.requestAnimationFrame(() => input?.focus());
    }
  }

  function commitInlineCustomInput(select, input, makeCode, fallbackLabel = "自定义") {
    const label = input?.value.trim() || "";
    if (!select || !input || !label) return "";
    const code = input.dataset.customValue || input.dataset.groupCode || input.dataset.categoryCode || makeCode(label);
    let option = Array.from(select.options).find(item => item.value === code);
    if (!option) {
      option = new Option(label || fallbackLabel, code);
      option.dataset.custom = "true";
      const customOption = Array.from(select.options).find(item => item.value === "__custom__");
      select.add(option, customOption ?? select.options.length);
    }
    option.textContent = label;
    select.value = code;
    input.dataset.customValue = code;
    if (input.id === "source-custom-group-input") input.dataset.groupCode = code;
    if (input.id === "source-custom-category-input") input.dataset.categoryCode = code;
    setInlineCustomInput(select, input, false);
    input.value = label;
    updateEcoSelectControl(select);
    select.dispatchEvent(new Event("change", { bubbles: true }));
    return code;
  }

  function bindInlineCustomInput(select, input, makeCode, fallbackLabel = "自定义") {
    if (!select || !input || input.dataset.inlineCustomBound === "true") return;
    input.dataset.inlineCustomBound = "true";
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        commitInlineCustomInput(select, input, makeCode, fallbackLabel);
      }
      if (event.key === "Escape") {
        event.preventDefault();
        setInlineCustomInput(select, input, false);
      }
    });
    input.addEventListener("blur", () => {
      if (!input.classList.contains("hidden")) {
        commitInlineCustomInput(select, input, makeCode, fallbackLabel);
      }
    });
  }

  function scopeLabel(scope) {
    const labels = {
      '范围一': '范围一（直接排放）',
      '范围二': '范围二（能源间接排放）',
      '范围三': '范围三（其他间接排放）'
    };
    return labels[scope] || scope || '—';
  }

  function statusTextClass(status) {
    if (status === '启用') return 'text-status-success';
    return 'text-slate-500';
  }

  function treeStatusClass(status) {
    if (status === '启用') return 'eco-tag-success';
    if (status === '部分启用') return 'eco-tag-warning';
    return 'eco-tag-muted';
  }

  function boundaryCategoryExpandKey(groupCode, category) {
    return `${groupCode}|${category}`;
  }

  function isBoundaryCategoryExpanded(groupCode, category) {
    const key = boundaryCategoryExpandKey(groupCode, category);
    return expandedBoundaryCategories[key] !== false;
  }

  function countSources(groupCode = '', category = '') {
    return emissionSourceData.filter(item => {
      if (!isWithinActualBoundary(item)) return false;
      const itemGroupCode = item.groupCode || Mock.getEmissionGroupByCategory?.(item.categoryCode)?.groupCode || '';
      const matchesGroup = !groupCode || itemGroupCode === groupCode;
      const matchesCategory = !category || item.categoryCode === category;
      return matchesGroup && matchesCategory;
    }).length;
  }

  function renderBoundaryTree() {
    const totalBadge = document.getElementById('source-boundary-total');
    if (totalBadge) totalBadge.innerText = `(${countSources()})`;
    treeContainer.innerHTML = `
      ${getActualBoundaryTree().map((group, index) => {
        const categories = group.children || [];
        const groupCount = countSources(group.groupCode);
        const expanded = expandedBoundaryScopes[group.groupCode] !== false;
        const groupActive = state.groupCode === group.groupCode && !state.treeCategory && !state.treeStatus;
        return `
        <div class="${index ? 'mt-2' : ''}">
          <button class="eco-tree-item eco-tree-group w-full cursor-pointer whitespace-nowrap" aria-current="${groupActive ? 'true' : 'false'}" data-tree-group="${group.groupCode}" data-scope-key="${group.groupCode}" type="button">
            <span class="material-symbols-outlined text-sm mr-2">${expanded ? 'expand_more' : 'chevron_right'}</span>
            <span class="flex-1 text-left">${escapeHtml(group.groupLabel)} (${groupCount})</span>
          </button>
          <div class="ml-5 space-y-1 mt-1 ${expanded ? '' : 'hidden'}">
            ${categories.map(item => {
              const active = state.groupCode === group.groupCode && state.treeCategory === item.category;
              const sources = item.children || [];
              return `<div>
                <button class="eco-tree-item w-full text-sm whitespace-nowrap" aria-current="${active ? 'true' : 'false'}" data-tree-category="${item.category}" data-tree-group="${group.groupCode}" type="button">
                  <span class="w-1.5 h-1.5 rounded-full mr-3" style="background:currentColor;"></span>
                  <span class="flex-1 text-left">${escapeHtml(item.categoryLabel)} (${sources.length})</span>
                </button>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}`;
  }

  function renderStatusSwitch(itemIndex, status) {
    const enabled = normalizeSourceStatus(status) === '启用';
    return `<button
      type="button"
      role="switch"
      aria-checked="${enabled ? 'true' : 'false'}"
      title="${enabled ? '点击停用' : '点击启用'}"
      class="source-action-btn eco-status-toggle ${enabled ? 'eco-status-toggle-on' : ''}"
      data-action="toggle-status"
      data-index="${itemIndex}">
      <span class="sr-only">${enabled ? '启用' : '停用'}</span>
      <span class="eco-status-toggle-track"><span class="eco-status-toggle-thumb"></span></span>
    </button>`;
  }

  function sourceClosureStatus(item) {
    if (normalizeSourceStatus(item.status) === '停用') {
      return { label: '-', className: 'eco-tag-muted', title: '排放源已停用，当前不参与核算状态判断' };
    }
    const sharedSource = sourceRowToShared(item);
    const latestRecord = Mock.getLatestActivityRecordBySource?.(sharedSource.id) || getLatestRecordByDatasources(sharedSource.datasourceIds);
    const model = matchModelForSource(sharedSource, latestRecord?.period || '');
    if (!model) {
      return { label: '待完善：核算模型', className: 'eco-tag-warning', title: '尚未命中可用核算模型' };
    }
    const factor = Mock.matchFactorByModelAndSource?.(model, sharedSource, latestRecord?.period || '');
    if (!factor) {
      return { label: '待完善：排放因子', className: 'eco-tag-warning', title: '已命中模型，但尚未命中排放因子' };
    }
    return { label: '可核算', className: 'eco-tag-success', title: '已匹配核算模型和排放因子' };
  }

  function closureBadge(item) {
    const status = sourceClosureStatus(item);
    return `<span class="eco-tag ${status.className}" title="${escapeHtml(status.title)}">${escapeHtml(status.label)}</span>`;
  }

  function renderRows(rows) {
    if (!rows.length) {
      tableBody.innerHTML = `<tr><td class="p-0" colspan="8"><div class="eco-empty-state min-h-[360px]"><div class="eco-empty-title">暂无匹配数据</div></div></td></tr>`;
      return;
    }
    tableBody.innerHTML = rows.map(item => {
      const itemIndex = emissionSourceData.indexOf(item);
      const active = itemIndex === selectedDetailIndex;
      const dataSourceCount = getBoundDatasourceIds(item).length;
      return `<tr class="cursor-pointer ${active ? 'eco-row-active' : ''}" data-source-index="${itemIndex}">
<td><button class="source-detail-btn eco-list-primary-text" data-index="${itemIndex}" type="button">${escapeHtml(item.name)}</button></td>
<td class="eco-table-cell-text">${escapeHtml(item.scope)}</td>
<td class="eco-list-secondary-text">
  ${escapeHtml(Mock.formatSourceActivityConfig?.(sourceRowToShared(item)) || item.activityDataTypeLabel || Mock.getActivityDataLabel?.(item.activityDataType) || '—')}
</td>
<td class="eco-table-cell-text">${escapeHtml(item.category)}</td>
<td class="eco-table-cell-text">${renderStatusSwitch(itemIndex, item.status)}</td>
<td class="eco-table-cell-text">${dataSourceCount}</td>
<td class="eco-table-cell-text">${closureBadge(item)}</td>
<td class="text-center whitespace-nowrap">
<div class="eco-action-buttons">
<button class="eco-btn eco-btn-secondary eco-action-btn source-edit-btn" data-index="${itemIndex}" type="button">编辑</button>
<button class="eco-btn eco-btn-danger eco-action-btn source-action-btn" data-action="delete" data-index="${itemIndex}" type="button">删除</button>
</div>
</td>
</tr>`;
    }).join('');
    attachRowEvents();
  }

  function getFilteredRows() {
    return emissionSourceData.filter(item => {
   
      const matchesKeyword = !state.keyword || item.name.includes(state.keyword);
      const matchesScope = state.scope === '全部' || item.scope === state.scope;
      const matchesStatus = state.status === '全部' || item.status === state.status;
      const matchesCategory = state.category === '全部' || item.category === state.category;
      const itemGroupCode = item.groupCode || Mock.getEmissionGroupByCategory?.(item.categoryCode)?.groupCode || '';
      const matchesTreeGroup = !state.groupCode || itemGroupCode === state.groupCode;
      const matchesTreeCategory = !state.treeCategory || item.categoryCode === state.treeCategory;
      const matchesTreeSource = !state.treeSourceId || item.id === state.treeSourceId;
      const matchesTreeStatus = !state.treeStatus || item.status === state.treeStatus;
      return matchesKeyword && matchesScope && matchesStatus && matchesCategory && matchesTreeGroup && matchesTreeCategory && matchesTreeSource && matchesTreeStatus;
    });
  }

  function renderPager(total) {
    const pageCount = Math.max(1, Math.ceil(total / state.pageSize));
    state.page = Math.min(state.page, pageCount);
    const startItem = total ? (state.page - 1) * state.pageSize + 1 : 0;
    const endItem = total ? Math.min(total, state.page * state.pageSize) : 0;
    totalText.innerText = `共 ${total} 条，显示 ${startItem}-${endItem} 条`;
    pageJumpInput.max = String(pageCount);
    pageJumpInput.value = String(state.page);
    const pages = pageCount <= 5
      ? Array.from({ length: pageCount }, (_, index) => index + 1)
      : Array.from(new Set([1, Math.max(1, state.page - 1), state.page, Math.min(pageCount, state.page + 1), pageCount])).sort((a, b) => a - b);
    const pageButtonClass = page => `eco-btn ${page === state.page ? 'eco-btn-primary' : 'eco-btn-secondary'} eco-btn-square-sm`;
    pagerBox.innerHTML = `
      <button class="eco-btn eco-btn-secondary eco-btn-square-sm" data-page="prev" ${state.page === 1 ? 'disabled' : ''}>
        <span class="material-symbols-outlined text-sm">chevron_left</span>
      </button>
      ${pages.map((page, index) => `${index > 0 && page - pages[index - 1] > 1 ? '<span class="eco-muted-text">...</span>' : ''}<button class="${pageButtonClass(page)}" data-page="${page}">${page}</button>`).join('')}
      <button class="eco-btn eco-btn-secondary eco-btn-square-sm" data-page="next" ${state.page === pageCount ? 'disabled' : ''}>
        <span class="material-symbols-outlined text-sm">chevron_right</span>
      </button>
    `;
  }

  function renderTable() {
    syncEmissionDatasourceBindings();
    const filtered = getFilteredRows();
    const start = (state.page - 1) * state.pageSize;
    renderBoundaryTree();
    renderRows(filtered.slice(start, start + state.pageSize));
    renderPager(filtered.length);
    syncEcoSelects();
  }

  function syncDetailDrawerFrame() {
    const rect = detailDrawerFrame.getBoundingClientRect();
    detailDrawer.style.top = `${rect.top}px`;
    detailDrawer.style.right = `${Math.max(0, window.innerWidth - rect.right)}px`;
    detailDrawer.style.height = `${rect.height}px`;
  }

  function setActiveTree(target) {
    treePanel.querySelectorAll('[data-tree-filter]').forEach(item => {
      item.classList.remove('eco-btn-primary');
      item.classList.add('eco-btn-secondary');
    });
    if (target) {
      target.classList.add('eco-btn-primary');
      target.classList.remove('eco-btn-secondary');
    }
  }

  function activityDataTypeLabel(value) {
    const labels = {
      electricity_consumption: '用电量',
      fuel_consumption: '燃料消耗量',
      replenishment_amount: '补充量',
      steam_consumption: '蒸汽用量',
      heat_consumption: '热力量',
      cooling_consumption: '冷量',
      transport_distance: '运输里程',
      commute_distance: '通勤里程',
      waste_weight: '废弃物重量'
    };
    return labels[value] || value || '';
  }

  function activityTextFromDatasources(datasources, fallback) {
    const activityTypes = Array.from(new Set(datasources.map(source => source.activityDataType).filter(Boolean)));
    if (!activityTypes.length) return fallback;
    return activityTypes.map(activityDataTypeLabel).join(' / ');
  }


  function normalizeModelPeriodValue(period) {
    if (!period) return '';
    const value = String(period).trim();
    const matchedMonth = value.match(/\d{4}-\d{2}/);
    return matchedMonth ? matchedMonth[0] : value;
  }

  function isModelPeriodMatched(model = {}, period = '') {
    const value = normalizeModelPeriodValue(period);
    const start = normalizeModelPeriodValue(model.periodStart || model.matchRule?.periodStart || model.effectiveDate || model.effectiveAt || '');
    const end = normalizeModelPeriodValue(model.periodEnd || model.matchRule?.periodEnd || model.expireDate || model.expiredAt || '');
    if (!value) return true;
    if (start && value < start) return false;
    if (end && value > end) return false;
    return true;
  }

  function getLatestRecordByDatasources(datasourceIds = []) {
    const ids = new Set((datasourceIds || []).filter(Boolean));
    const records = (Mock.ActivityDataRecords || [])
      .filter(record => ids.has(record.datasourceId))
      .slice()
      .sort((a, b) => String(b.collectedAt || '').localeCompare(String(a.collectedAt || '')) || String(b.period || '').localeCompare(String(a.period || '')));
    return records[0] || null;
  }

  function matchModelForSource(sharedSource, period = '') {
    const sourceCategory = Mock.toAccountingCategoryCode?.(sharedSource?.categoryCode || sharedSource?.category || '') || sharedSource?.categoryCode || sharedSource?.category || '';
    const sourceScope = sharedSource?.scope || Mock.inferScopeByCategory?.(sourceCategory) || '';
    const models = Mock.getAccountingModels?.() || Mock.AccountingModels || [];
    const matched = models.find(model => {
      const modelCategory = model.categoryCode || model.category || '';
      const modelScope = model.scope || Mock.inferScopeByCategory?.(modelCategory) || '';
      return model.status !== '停用'
        && modelScope === sourceScope
        && modelCategory === sourceCategory
        && isModelPeriodMatched(model, period);
    });
    return matched || Mock.matchModel?.(sharedSource, models) || null;
  }

  function accountingInfo(item, datasources = []) {
    const category = item.boundaryCategory || item.category || '';
    const sharedSource = sourceRowToShared(item);
    const latestRecord = Mock.getLatestActivityRecordBySource?.(sharedSource.id) || getLatestRecordByDatasources(sharedSource.datasourceIds);
    const model = matchModelForSource(sharedSource, latestRecord?.period || '');
    const matchedFactor = model && Mock.matchFactorByModelAndSource?.(model, sharedSource, latestRecord?.period || '');
    const factorGroup = matchedFactor || (model && Mock.getFactorGroupByModel?.(model));
    const formulaMap = [
      {
        test: () => category === '固定燃烧',
        value: { activity: '燃料消耗量', factor: '燃料低位热值与排放因子', frequency: '月', formula: 'E = AD × NCV × EF × OF / 1000', note: 'AD 为燃料消耗量，NCV 为低位热值，EF 为单位热值排放因子，OF 为氧化率。' }
      },
      {
        test: () => category === '逸散排放',
        value: { activity: '制冷剂补充量 / 泄漏量', factor: '制冷剂 GWP 因子', frequency: '月', formula: 'E = AD × GWP / 1000', note: 'AD 为制冷剂补充或泄漏质量，GWP 为对应制冷剂全球变暖潜势。' }
      },
      {
        test: () => category === '外购电力',
        value: { activity: '购电量', factor: '区域电网排放因子', frequency: '月', formula: 'E = AD × EF', note: 'AD 为外购电量，EF 为区域电网或市场化电力排放因子。' }
      },
      {
        test: () => category.includes('运输'),
        value: { activity: '运输里程 / 货运周转量', factor: '运输方式排放因子', frequency: '月', formula: 'E = 运输距离 × 载重 × EF', note: '按车辆类型、燃料类型或承运商提供因子计算运输排放。' }
      },
      {
        test: () => category.includes('员工通勤'),
        value: { activity: '通勤人次 / 通勤里程', factor: '客运交通排放因子', frequency: '月', formula: 'E = 人次 × 单程距离 × 往返次数 × EF', note: '按交通方式分别汇总后折算为二氧化碳当量。' }
      }
    ];
    const matched = formulaMap.find(item => item.test())?.value || {
      activity: '活动数据',
      factor: '默认排放因子',
      frequency: '月',
      formula: 'E = AD × EF',
      note: 'AD 为活动数据，EF 为所选核算模型对应的排放因子。'
    };
    return {
      model: model?.name || `${category || '排放源'}核算模型`,
      activity: activityTextFromDatasources(datasources, matched.activity),
      factor: factorGroup?.name || matched.factor,
      frequency: matched.frequency,
      formula: matched.formula,
      note: matched.note,
      quality: model ? '90%' : '80%'
    };
  }

  function formatFactorMatchRule(model) {
    const rule = model?.factorMatchRule || model?.matchRule;
    if (!rule) return '暂无匹配规则';
    const conditions = Object.entries(rule.conditions || {})
      .map(([key, value]) => `${key}=${Mock.getAccountingParamLabel?.(key, value) || value}`)
      .join('、');
    const fields = Array.isArray(rule.fields) && rule.fields.length ? `fields=${rule.fields.join('+')}` : '';
    const period = model?.periodStart || model?.periodEnd ? `period=${model.periodStart || '不限'}~${model.periodEnd || '长期'}` : '';
    return [
      rule.standardId || model?.standardId ? `standardId=${rule.standardId || model.standardId}` : '',
      rule.factorGroupId ? `factorGroupId=${rule.factorGroupId}` : '',
      rule.activityDataType ? `activityDataType=${rule.activityDataType}` : '',
      fields,
      period,
      conditions ? `conditions: ${conditions}` : ''
    ].filter(Boolean).join(' / ') || '暂无匹配规则';
  }

  function renderDetailRows(rows = []) {
    return rows
      .filter(row => row && row.label)
      .map(row => {
        const muted = row.muted ? 'source-detail-value-muted' : '';
        return `
          <div class="source-detail-label">${escapeHtml(row.label)}</div>
          <div class="source-detail-value ${muted} ${row.className || ''}">${escapeHtml(row.value || '—')}</div>`;
      })
      .join('');
  }

  function getActualSourceDetailRows(item, boundDatasources, latestRecord) {
    const sharedSource = sourceRowToShared(item);
    const categoryCode = item.categoryCode || sharedSource.categoryCode || '';
    const belongingCategoryCode = item.belongingCategoryCode || item.belongingCategory || sharedSource.belongingCategoryCode || '';
    const accountingCategory = Mock.toAccountingCategoryCode?.(categoryCode) || categoryCode;
    const schema = getSourceActivityParamSchema(belongingCategoryCode) || getSourceActivityParamSchema(accountingCategory) || {};
    const params = item.accountingParams || {};
    const labels = item.accountingParamLabels || {};
    const datasourceUnits = Array.from(new Set(boundDatasources.map(source => source.unit || source.energyUnit).filter(Boolean)));
    const unit = item.unit || schema.defaultUnit || datasourceUnits.join(' / ') || '';
    const paramRows = (schema.params || []).map(param => {
      const rawValue = params[param.key];
      const readableValue = labels[param.key] || Mock.getAccountingParamLabel?.(param.key, params[param.key]) || rawValue || '';
      return {
        label: param.label,
        value: readableValue || '待配置',
        muted: !readableValue
      };
    });
    return [
      {
        label: '活动数据类型',
        value: item.activityDataTypeLabel || schema.activityDataTypeLabel || Mock.getActivityDataLabel?.(item.activityDataType || schema.activityDataType) || '待配置',
        muted: !(item.activityDataTypeLabel || schema.activityDataTypeLabel || item.activityDataType || schema.activityDataType)
      },
      ...paramRows,
      {
        label: '单位',
        value: item.unit || unit || '待配置',
        muted: !(item.unit || unit)
      }
    ];
  }

  function renderDetail(index) {
    const item = emissionSourceData[index];
    if (!item) {
      closeDetailDrawer();
      return;
    }
    const boundDatasources = getBoundDatasources(item);
    const sharedSource = sourceRowToShared(item);
    const latestRecord = Mock.getLatestActivityRecordBySource?.(sharedSource.id) || getLatestRecordByDatasources(sharedSource.datasourceIds);
    const matchedModel = matchModelForSource(sharedSource, latestRecord?.period || '');
    const matchedFactor = matchedModel && Mock.matchFactorByModelAndSource?.(matchedModel, sharedSource, latestRecord?.period || '');
    const datasourceNames = getDatasourceNames(item.datasourceIds || []);
    const closure = sourceClosureStatus(item);
    const actualRows = getActualSourceDetailRows(item, boundDatasources, latestRecord);
    const basicRows = renderDetailRows([
      { label: '排放源名称', value: item.name },
      { label: '排放大类', value: item.groupLabel || '待配置', muted: !item.groupLabel },
      { label: '排放类别', value: item.category },
      { label: '所属范围', value: scopeLabel(item.scope) },
      { label: '所属类别', value: item.belongingCategoryLabel || '待配置', muted: !item.belongingCategoryLabel }
    ]);
    const sourceFeatureRows = renderDetailRows(actualRows);
    const closureRows = renderDetailRows([
      { label: '数据源', value: datasourceNames, muted: datasourceNames === '待绑定' },
      { label: '数据源数量', value: `${boundDatasources.length} 个` },
      { label: '匹配模型', value: matchedModel?.name || '待配置模型', muted: !matchedModel?.name },
      { label: '匹配因子', value: matchedFactor?.name || '待配置因子', muted: !matchedFactor?.name }
    ]);
    detailDrawerContent.innerHTML = `
      <div class="source-detail-stack">
      <section class="source-detail-section source-detail-section-basic">
        <h3 class="source-detail-heading">基础信息</h3>
        <div class="source-detail-grid">
          ${basicRows}
        </div>
      </section>
      <section class="source-detail-section source-detail-section-config">
        <h3 class="source-detail-heading">活动数据配置</h3>
        <div class="source-detail-grid">
          ${sourceFeatureRows}
        </div>
      </section>
      <section class="source-detail-section source-detail-section-closure">
        <h3 class="source-detail-heading">核算信息</h3>
        <div class="source-detail-grid">
          <div class="source-detail-label">核算状态</div>
          <div class="source-detail-value"><span class="eco-tag ${closure.className}" title="${escapeHtml(closure.title)}">${escapeHtml(closure.label)}</span></div>
          ${closureRows}
        </div>
      </section>
      </div>`;
  }

  function openDetailDrawer(index) {
    if (detailDrawerCloseTimer) {
      window.clearTimeout(detailDrawerCloseTimer);
      detailDrawerCloseTimer = null;
    }
    selectedDetailIndex = index;
    selectedDetailSourceId = emissionSourceData[index]?.id || null;
    detailDrawerTitle.innerText = '\u6392\u653e\u6e90\u8be6\u60c5';
    syncDetailDrawerFrame();
    renderDetail(index);
    detailDrawer.classList.remove('hidden');
    detailDrawer.classList.add('flex');
    window.requestAnimationFrame(() => {
      detailDrawer.classList.remove('translate-x-full');
    });
    renderTable();
  }

  function closeDetailDrawer() {
    selectedDetailIndex = null;

  function inferDatasourceAccountingDefaults(datasourceIds, belongingCategoryCode) {
    const selected = datasourceIds.map(id => datasourceMap.get(id)).filter(Boolean);
    const schema = getSourceActivityParamSchema(belongingCategoryCode);
    const defaults = { params: {}, labels: {}, unit: selected[0]?.unit || schema?.defaultUnit || "" };
    if (!schema) return defaults;

    (schema.params || []).forEach(param => {
      const candidate = selected.find(source =>
        source[param.key] ||
        source.accountingParams?.[param.key] ||
        (param.key === "energyType" && (source.apiEnergyType || source.energyType || source.meterTypeLabel)) ||
        (param.key === "fuelType" && (source.fuelType || source.energyType || source.meterTypeLabel)) ||
        (param.key === "refrigerantType" && (source.refrigerantType || source.energyType || source.meterTypeLabel))
      );
      if (!candidate) return;

      const rawLabel =
        candidate[param.key] ||
        candidate.accountingParams?.[param.key] ||
        (param.key === "energyType" ? (candidate.apiEnergyType || candidate.energyType || candidate.meterTypeLabel) : "") ||
        (param.key === "fuelType" ? (candidate.fuelType || candidate.energyType || candidate.meterTypeLabel) : "") ||
        (param.key === "refrigerantType" ? (candidate.refrigerantType || candidate.energyType || candidate.meterTypeLabel) : "");
      const customLabel = String(rawLabel || "").trim();
      if (!customLabel) return;

      const option = (param.options || []).find(item =>
        String(item.value || "") === customLabel ||
        String(item.label || "") === customLabel
      );

      if (option && option.value !== "__custom__") {
        defaults.params[param.key] = option.value;
        defaults.labels[param.key] = option.label || option.value;
        if (option.unit) defaults.unit = option.unit;
      } else if (param.allowCustom) {
        defaults.params[param.key] = makeCustomAccountingParamValue(param.key, customLabel);
        defaults.labels[param.key] = customLabel;
      }
    });

    return defaults;
  }

}

function renderAccountingParams(belongingCategoryCode, values = {}, labels = {}, options = {}) {
  const section = document.getElementById('source-accounting-params-section');
  const box = document.getElementById('source-accounting-params');
  const unitInput = document.getElementById('source-unit-input');

  const customScope3 = isCustomScope3BelongingCategory(belongingCategoryCode);
  const schema = getSourceActivityParamSchema(belongingCategoryCode);
  const activeSchema = schema || (customScope3 ? {
    category: belongingCategoryCode,
    activityDataType: options.activityDataType || values.activityDataType || '',
    activityDataTypeLabel: options.activityDataTypeLabel || labels.activityDataType || '',
    defaultUnit: options.unit || '',
    params: [{
      key: 'customSpecificType',
      label: '\u5177\u4f53\u7c7b\u578b',
      allowCustom: true,
      options: [{ value: '__custom__', label: '\u81ea\u5b9a\u4e49' }]
    }]
  } : null);
  const params = activeSchema?.params || [];
  const forceUnit = options.forceUnit === true;

  const firstParam = params[0];
  const firstOption = firstParam?.options?.find(option => option.value !== '__custom__');

  if (unitInput) {
    const nextUnit = firstOption?.unit || activeSchema?.defaultUnit || '';
    if (forceUnit || !unitInput.value) {
      unitInput.value = nextUnit;
    }
  }

  section.classList.toggle('hidden', !activeSchema);

  if (!activeSchema || !params.length) {
    box.innerHTML = `
      <div class="col-span-2 rounded border border-dashed border-slate-300 p-4 text-sm text-slate-500">
        当前所属类别尚未配置活动数据规则，请先在核算边界中选择已配置的二级类别。
      </div>
    `;
    return;
  }

  box.innerHTML = params.map(param => {
    const options = param.options || [];
    const orderedOptions = [...options.filter(option => option.value !== '__custom__'), ...options.filter(option => option.value === '__custom__')];
    const firstBuiltInOption = options.find(option => option.value !== '__custom__');
    const current = values[param.key] || firstBuiltInOption?.value || '';
    const hasCurrentOption = options.some(option => option.value === current);
    const selectValue = hasCurrentOption ? current : (param.allowCustom ? '__custom__' : current);
    const customValue = hasCurrentOption
      ? (values[`${param.key}Custom`] || '')
      : (labels[param.key] || values[`${param.key}Custom`] || current || '');

    return `<div class="eco-field" data-accounting-param="${escapeHtml(param.key)}">
      <label class="eco-form-label block mb-1">${escapeHtml(param.label || param.key)}</label>
      <select class="eco-select h-11"
              data-accounting-param-select="${escapeHtml(param.key)}">
        ${orderedOptions.map(option => `
          <option value="${escapeHtml(option.value)}" ${option.value === selectValue ? 'selected' : ''}>
            ${escapeHtml(option.label || option.value)}
          </option>
        `).join('')}
      </select>
      <input class="eco-input h-11 ${selectValue === '__custom__' ? '' : 'hidden'}"
             data-accounting-param-custom="${escapeHtml(param.key)}"
             placeholder="请输入自定义${escapeHtml(param.label || '参数')}"
             type="text"
             value="${escapeHtml(customValue)}">
    </div>`;
  }).join('');

  box.querySelectorAll('[data-accounting-param-select]').forEach(select => {
    const key = select.dataset.accountingParamSelect;
    const customInput = box.querySelector(`[data-accounting-param-custom="${CSS.escape(key)}"]`);
    bindInlineCustomInput(select, customInput, value => `custom_param_${key}_${makeCustomCategoryCode(value).replace(/^custom_category_/, "")}`, "自定义");
    select.addEventListener('change', () => {
      setInlineCustomInput(select, customInput, select.value === '__custom__');

      const param = params.find(item => item.key === key);
      const option = (param?.options || []).find(item => item.value === select.value);

      if (unitInput) {
        unitInput.value = option?.unit || activeSchema.defaultUnit || unitInput.value || '';
      }
    });
    setInlineCustomInput(select, customInput, select.value === '__custom__');
  });
  syncEcoSelects(box);
}

function collectAccountingParamForm() {
  const params = {};
  const labels = {};

  document.querySelectorAll('[data-accounting-param-select]').forEach(select => {
    const key = select.dataset.accountingParamSelect;
    const customInput = document.querySelector(`[data-accounting-param-custom="${CSS.escape(key)}"]`);

    if (select.value === '__custom__') {
      const customLabel = customInput?.value.trim() || '';
      params[key] = makeCustomAccountingParamValue(key, customLabel);
      params[`${key}Custom`] = customLabel;
      labels[key] = customLabel;
    } else {
      const selectedOption = select.options[select.selectedIndex];
      params[key] = select.value;
      labels[key] = selectedOption?.textContent?.trim() || select.value;
    }
  });

  return { params, labels };
}

function collectAccountingParams() {
  return collectAccountingParamForm().params;
}

function getAddSourceCategoryContext() {

  function closeModal() {

  }

  function setSourceFormInvalid(element, invalid) {
    if (!element) return;
    element.classList.toggle('border-status-error', invalid);
    element.classList.toggle('ring-1', invalid);
    element.classList.toggle('ring-status-error', invalid);
  }

  function clearSourceFormValidation() {
    [
      'source-name-input',
      'source-group-select',
      'source-custom-group-input',
      'source-category-select',
      'source-custom-category-input',
      'source-unit-input',
      'source-scope-select',
      'source-belonging-category-select',
      'source-datasource-category',
      'source-datasource-options'
    ].forEach(id => setSourceFormInvalid(document.getElementById(id), false));
  }

  function validateSourceForm(selectedIds) {
    clearSourceFormValidation();
    const sourceNameInput = document.getElementById("source-name-input");
    const sourceGroupSelect = document.getElementById("source-group-select");
    const customGroupInput = document.getElementById("source-custom-group-input");
    const sourceCategorySelect = document.getElementById("source-category-select");
    const customCategoryInput = document.getElementById("source-custom-category-input");
    const sourceUnitInput = document.getElementById("source-unit-input");
    const sourceScopeInput = document.getElementById("source-scope-select");
    const belongingCategorySelect = document.getElementById("source-belonging-category-select");
    const datasourceCategorySelect = document.getElementById("source-datasource-category");
    const datasourceOptionsBox = document.getElementById("source-datasource-options");
    const missing = [];

    const requireField = (condition, label, element) => {
      if (condition) return;
      missing.push(label);
      setSourceFormInvalid(element, true);
    };

    requireField(Boolean(sourceNameInput.value.trim()), "排放源名称", sourceNameInput);
    requireField(Boolean(sourceGroupSelect.value), "排放源大类", sourceGroupSelect);
    if (sourceGroupSelect.value === "__custom__") {
      requireField(Boolean(customGroupInput.value.trim()), "自定义大类名称", customGroupInput);
    }
    requireField(Boolean(sourceCategorySelect.value), "排放类别", sourceCategorySelect);
    if (sourceCategorySelect.value === "__custom__") {
      requireField(Boolean(customCategoryInput.value.trim()), "自定义二级类别名称", customCategoryInput);
    }
    requireField(Boolean(sourceUnitInput.value.trim()), "单位", sourceUnitInput);
    requireField(Boolean(sourceScopeInput.dataset.scopeCode), "所属范围", sourceScopeInput);
    requireField(Boolean(belongingCategorySelect.value), "所属类别", belongingCategorySelect);
    requireField(Boolean(datasourceCategorySelect.value), "数据源类别", datasourceCategorySelect);
    requireField(selectedIds.length > 0, "选择数据源", datasourceOptionsBox);

    if (!missing.length) return true;
    window.alert(`请完善必填项：${missing.join("、")}`);
    const firstInvalid = [
      sourceNameInput,
      sourceGroupSelect,
      (sourceGroupSelect.value === "__custom__" || sourceGroupSelect.selectedOptions?.[0]?.dataset?.custom === "true") ? customGroupInput : null,
      sourceCategorySelect,
      (sourceCategorySelect.value === "__custom__" || sourceCategorySelect.selectedOptions?.[0]?.dataset?.custom === "true") ? customCategoryInput : null,
      sourceUnitInput,
      sourceScopeInput,
      belongingCategorySelect,
      datasourceCategorySelect,
      datasourceOptionsBox
    ].find(element => element?.classList.contains("border-status-error"));
    firstInvalid?.scrollIntoView?.({ block: "center", behavior: "smooth" });
    firstInvalid?.focus?.();
    return false;
  }

  function getBoundaryGroupByCategory(categoryCode) {
    for (const group of getActualBoundaryTree()) {
      if ((group.children || []).some(category => category.category === categoryCode)) return group;
    }
    return null;
  }

  function validateBoundaryCategoryGroup(selectedGroupCode, selectedCategory) {
    const boundaryGroup = getBoundaryGroupByCategory(selectedCategory);
    if (!boundaryGroup || !selectedGroupCode || selectedGroupCode === boundaryGroup.groupCode) return true;
    const selectedGroupLabel = getGroupNode(selectedGroupCode)?.groupLabel || selectedGroupCode;
    const categoryLabel = Mock.toCategoryLabel?.(selectedCategory) || selectedCategory;
    window.alert(`\u4e8c\u7ea7\u5206\u7c7b\u300c${categoryLabel}\u300d\u5df2\u5728\u300c${boundaryGroup.groupLabel}\u300d\u4e0b\u6dfb\u52a0\uff0c\u4e0d\u80fd\u518d\u6dfb\u52a0\u5230\u300c${selectedGroupLabel}\u300d\u4e0b\u3002`);
    setSourceFormInvalid(document.getElementById('source-group-select'), true);
    setSourceFormInvalid(document.getElementById('source-category-select'), true);
    return false;
  }

  function saveSourceForm() {
    refreshDatasourceCatalog();
    const ownerMap = buildDatasourceOwnerMap(sourceFormState.editingIndex);
    const selectedIds = Array.from(new Set(sourceFormState.selectedIds)).filter(id => !ownerMap.has(id));
    if (!validateSourceForm(selectedIds)) return;

    const categorySelect = document.getElementById("source-category-select");
    const selectedOption = categorySelect.selectedOptions && categorySelect.selectedOptions[0];
    const scopeSelect = document.getElementById("source-scope-select");
    const belongingCategorySelect = document.getElementById("source-belonging-category-select");
    const belongingOption = belongingCategorySelect?.selectedOptions && belongingCategorySelect.selectedOptions[0];
    const groupSelect = document.getElementById("source-group-select");
    const selectedGroupCode = groupSelect.value;
    const isCustomGroup = selectedGroupCode === "__custom__" || groupSelect.selectedOptions?.[0]?.dataset?.custom === "true";
    const isCustomCategory = categorySelect.value === "__custom__" || categorySelect.selectedOptions?.[0]?.dataset?.custom === "true";
    const customGroupInput = document.getElementById("source-custom-group-input");
    const customCategoryInput = document.getElementById("source-custom-category-input");
    const customGroupLabel = customGroupInput ? customGroupInput.value.trim() : "";
    const customCategoryLabel = customCategoryInput ? customCategoryInput.value.trim() : "";

    const groupCode = isCustomGroup
      ? (selectedGroupCode !== "__custom__" ? selectedGroupCode : (customGroupInput?.dataset?.groupCode || makeCustomGroupCode(customGroupLabel)))
      : selectedGroupCode;
    const groupLabel = isCustomGroup
      ? (customGroupLabel || "自定义大类")
      : (groupSelect.options[groupSelect.selectedIndex]?.textContent?.trim() || selectedGroupCode || "");

    const selectedCategory = isCustomCategory
      ? (categorySelect.value !== "__custom__" ? categorySelect.value : (customCategoryInput?.dataset?.categoryCode || makeCustomCategoryCode(customCategoryLabel)))
      : categorySelect.value;
    const categoryLabel = isCustomCategory
      ? (customCategoryLabel || "自定义二级类别")
      : (selectedOption?.dataset?.categoryLabel || selectedOption?.textContent?.trim() || Mock.toCategoryLabel?.(selectedCategory) || selectedCategory);

    const scopeCode =
      scopeSelect?.value ||
      selectedOption?.dataset?.scope ||
      document.getElementById("source-scope-select")?.dataset?.scopeCode ||
      Mock.inferScopeByCategory?.(selectedCategory) ||
      "scope3";
    const scopeLabel =
      scopeSelect?.options?.[scopeSelect.selectedIndex]?.textContent?.trim() ||
      selectedOption?.dataset?.scopeLabel ||
      Mock.toScopeLabel?.(scopeCode) ||
      "范围三";
    const belongingCategoryCode = belongingCategorySelect?.value || "";
    const belongingCategoryLabel =
      belongingOption?.dataset?.categoryLabel ||
      belongingOption?.textContent?.trim() ||
      Mock.toCategoryLabel?.(belongingCategoryCode) ||
      belongingCategoryCode;

    const schema = getSourceActivityParamSchema(belongingCategoryCode) || {};
    const accountingForm = collectAccountingParamForm();
    const customActivityDataTypeLabel = accountingForm.labels.customSpecificType || accountingForm.params.customSpecificTypeCustom || "";
    const activityDataTypeLabel = schema.activityDataTypeLabel || (
      isCustomScope3BelongingCategory(belongingCategoryCode) ? customActivityDataTypeLabel : ""
    );
    const activityDataType = schema.activityDataType || (
      isCustomScope3BelongingCategory(belongingCategoryCode) && activityDataTypeLabel
        ? makeCustomActivityDataTypeCode(activityDataTypeLabel)
        : ""
    );
    const existingSource = sourceFormState.mode === "edit" && sourceFormState.editingIndex !== null
      ? emissionSourceData[sourceFormState.editingIndex]
      : null;
    const firstSelectedDatasource = datasourceMap.get(selectedIds[0]);
    const payload = {
      name: document.getElementById("source-name-input").value.trim() || "未命名排放源",
      groupCode,
      groupLabel,
      scope: scopeCode,
      scopeCode,
      scopeLabel,
      belongingCategory: belongingCategoryCode,
      belongingCategoryCode,
      belongingCategoryLabel,
      category: selectedCategory,
      categoryCode: selectedCategory,
      categoryLabel,
      boundaryCategory: categoryLabel,
      activityDataType,
      activityDataTypeLabel,
      activityDataLabel: activityDataTypeLabel,
      accountingParams: accountingForm.params,
      accountingParamLabels: accountingForm.labels,
      status: document.getElementById("source-status-checkbox").checked ? "启用" : "停用",
      dataSources: String(selectedIds.length),
      datasourceIds: selectedIds,
      unit: document.getElementById("source-unit-input").value.trim() || schema.defaultUnit || "",
      org: existingSource?.org || firstSelectedDatasource?.org || ""
    };
    if (sourceFormState.mode === 'edit' && sourceFormState.editingIndex !== null) {
  emissionSourceData[sourceFormState.editingIndex] = {
    ...emissionSourceData[sourceFormState.editingIndex],
    ...payload
  };

  const saved = persistSourceRow(emissionSourceData[sourceFormState.editingIndex]);

  if (saved) {
    Object.assign(emissionSourceData[sourceFormState.editingIndex], sharedSourceToRow(saved));
  }

  if (selectedDetailIndex === sourceFormState.editingIndex) {
    selectedDetailSourceId =
      saved?.id ||
      emissionSourceData[sourceFormState.editingIndex]?.id ||
      selectedDetailSourceId;
  }

  // 编辑后如果修改了分类/状态，也回到全部视图，避免看起来“消失”
  state.keyword = '';
  state.scope = '全部';
  state.status = '全部';
  state.category = '全部';
  state.groupCode = '';
  state.treeScope = '';
  state.treeCategory = '';
  state.treeSourceType = '';
  state.treeSourceId = '';
  state.treeStatus = '';
  state.page = 1;
} else {
  emissionSourceData.unshift(payload);
  const saved = persistSourceRow(emissionSourceData[0]);

  if (saved) {
    Object.assign(emissionSourceData[0], sharedSourceToRow(saved));
  }

  // 新增后回到全部视图，避免被当前左侧树或筛选条件过滤掉
  state.keyword = '';
  state.scope = '全部';
  state.status = '全部';
  state.category = '全部';
  state.groupCode = '';
  state.treeScope = '';
  state.treeCategory = '';
  state.treeSourceType = '';
  state.treeSourceId = '';
  state.treeStatus = '';
  state.page = 1;
}

closeModal();
syncPendingFiltersFromState();
refreshSourceDataViews();
  }

    select.addEventListener('change', () => {
      const keys = ['scope', 'status', 'category'];
      pendingFilters[keys[index]] = select.value;
      if (keys[index] === 'scope') {
        const allowedCategories = getFilterCategories(pendingFilters.scope);
        if (pendingFilters.category !== '全部' && !allowedCategories.includes(pendingFilters.category)) {
          pendingFilters.category = '全部';

        setupFilters();

    });

  resetButton.addEventListener('click', () => {
    Object.assign(state, { keyword: '', scope: '全部', status: '全部', category: '全部', groupCode: '', treeScope: '', treeCategory: '', treeSourceType: '', treeSourceId: '', treeStatus: '', page: 1 });

    if (categoryButton) {
      state.groupCode = categoryButton.dataset.treeGroup || '';
      state.treeScope = '';
      state.treeCategory = categoryButton.dataset.treeCategory || '';
      state.treeSourceType = '';
      state.treeSourceId = '';
      state.treeStatus = '';
      state.page = 1;
      closeDetailDrawer();
      return;
    }
    const groupButton = event.target.closest('[data-tree-group]');
    if (groupButton) {
      const groupCode = groupButton.dataset.treeGroup;
      expandedBoundaryScopes[groupCode] = !expandedBoundaryScopes[groupCode];
      state.groupCode = groupCode || '';
      state.treeScope = '';
      state.treeCategory = '';
      state.treeSourceType = '';
      state.treeSourceId = '';
      state.treeStatus = '';
      state.page = 1;
      closeDetailDrawer();
      return;
    }
  });

  pagerBox.addEventListener('click', event => {
    const button = event.target.closest('button[data-page]');
    if (!button || button.disabled) return;
    const filtered = getFilteredRows();
    const pageCount = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    if (button.dataset.page === 'prev' && state.page > 1) state.page -= 1;
    if (button.dataset.page === 'next' && state.page < pageCount) state.page += 1;
    if (/^\d+$/.test(button.dataset.page)) state.page = Number(button.dataset.page);
    renderTable();
  });

  pageSizeSelect.addEventListener('change', () => {
    state.pageSize = Number.parseInt(pageSizeSelect.value, 10);
    state.page = 1;
    renderTable();
  });

  function jumpToInputPage() {
    const filtered = getFilteredRows();
    const pageCount = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    const target = Math.min(pageCount, Math.max(1, Number.parseInt(pageJumpInput.value, 10) || 1));
    state.page = target;
    renderTable();
  }

  pageJumpInput.addEventListener('keydown', event => {
    if (event.key === 'Enter') jumpToInputPage();
  });

  pageJumpInput.addEventListener('change', jumpToInputPage);

  const tabCards = document.querySelectorAll('.tab-card');
  const tabContents = document.querySelectorAll('.tab-content');

  tabCards.forEach(card => {
    card.addEventListener('click', () => {
      tabCards.forEach(c => {
        c.classList.remove('eco-btn-primary');
        c.classList.add('eco-btn-secondary');
        
        const check = c.querySelector('.tab-check');
        if(check) check.classList.add('hidden');
      });

      card.classList.add('eco-btn-primary');
      card.classList.remove('eco-btn-secondary');
      
      const activeCheck = card.querySelector('.tab-check');
      if(activeCheck) activeCheck.classList.remove('hidden');

      const targetId = card.id.replace('tab-', 'content-');
      tabContents.forEach(content => {
        if(content.id === targetId) {
          content.classList.remove('hidden');
        } else {
          content.classList.add('hidden');
        }
      });
    });
  });
</script>
