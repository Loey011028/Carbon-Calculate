<script data-purpose="factor-library-interactions">
(function() {
  let pageSize = 5;
  const Mock = window.CarbonAccountingMock || window;
  const defaultFactors = Mock.DefaultFactorLibraryFactors || Mock.FactorLibraryFactors || [];
  const defaultGroups = Mock.DefaultFactorLibraryGroups || Mock.FactorLibraryGroups || [];
  const defaultStandards = Mock.DefaultFactorStandards || Mock.FactorStandards || [];
  const defaultStandardFiles = Mock.DefaultStandardFiles || Mock.StandardFiles || [];

  Mock.FactorLibraryFactors = Array.isArray(Mock.FactorLibraryFactors) && Mock.FactorLibraryFactors.length ? Mock.FactorLibraryFactors : defaultFactors;
  Mock.FactorLibraryGroups = Array.isArray(Mock.FactorLibraryGroups) && Mock.FactorLibraryGroups.length ? Mock.FactorLibraryGroups : defaultGroups;
  Mock.FactorStandards = Array.isArray(Mock.FactorStandards) && Mock.FactorStandards.length ? Mock.FactorStandards : defaultStandards;
  Mock.StandardFiles = Array.isArray(Mock.StandardFiles) && Mock.StandardFiles.length ? Mock.StandardFiles : defaultStandardFiles;

  const factors = Mock.FactorLibraryFactors;
  const groups = Mock.FactorLibraryGroups;
  const factorStandards = Mock.FactorStandards;
  const standards = Mock.StandardFiles;
  window.FactorLibraryFactors = factors;
  window.FactorLibraryGroups = groups;
  window.FactorStandards = factorStandards;
  window.StandardFiles = standards;
  if (window.CarbonAccountingMock) {
    window.CarbonAccountingMock.FactorLibraryFactors = factors;
    window.CarbonAccountingMock.FactorLibraryGroups = groups;
    window.CarbonAccountingMock.FactorStandards = factorStandards;
    window.CarbonAccountingMock.StandardFiles = standards;
  }

  let activeTab = 'factor';
  let factorPage = 1;
  let groupPage = 1;
  let currentCategoryKey = 'all';
  const treeExpandedKeys = new Set(['all']);
  let versionContext = {
    kind: "",
    id: "",
    item: null
  };

  function closeEcoSelectMenu() {
    document.querySelector("[data-eco-select-menu]")?.remove();
    document.querySelectorAll("[data-eco-select-control]").forEach((button) => button.setAttribute("aria-expanded", "false"));
  }

  function updateEcoSelectControl(select) {
    const shell = select.closest("[data-eco-select-shell]");
    const label = shell?.querySelector("[data-eco-select-value-label]");
    if (label) label.textContent = select.options[select.selectedIndex]?.textContent || "";
  }

  function openEcoSelectMenu(select) {
    if (select.disabled) return;
    const shell = select.closest("[data-eco-select-shell]");
    const control = shell?.querySelector("[data-eco-select-control]");
    if (!shell || !control) return;
    const wasOpen = control.getAttribute("aria-expanded") === "true";
    closeEcoSelectMenu();
    if (wasOpen) return;

    const rect = control.getBoundingClientRect();
    const viewportMargin = 8;
    const menuGap = 6;
    const menu = document.createElement("div");
    menu.dataset.ecoSelectMenu = "true";
    menu.className = "eco-select-menu";
    menu.style.left = `${Math.min(Math.max(viewportMargin, rect.left), Math.max(viewportMargin, window.innerWidth - rect.width - viewportMargin))}px`;
    menu.style.width = `${rect.width}px`;
    menu.innerHTML = Array.from(select.options).map((option) => `<button type="button" class="eco-select-option" data-eco-select-value="${escapeHtml(option.value)}" aria-selected="${option.selected ? "true" : "false"}">${escapeHtml(option.textContent)}</button>`).join("");
    menu.addEventListener("click", (event) => {
      const option = event.target.closest("[data-eco-select-value]");
      if (!option) return;
      select.value = option.dataset.ecoSelectValue || "";
      updateEcoSelectControl(select);
      closeEcoSelectMenu();
      select.dispatchEvent(new Event("change", { bubbles: true }));
    });
    document.body.appendChild(menu);

    const belowSpace = window.innerHeight - rect.bottom - viewportMargin;
    const aboveSpace = rect.top - viewportMargin;
    const preferredHeight = Math.min(menu.scrollHeight, 240);
    const openUp = belowSpace < preferredHeight && aboveSpace > belowSpace;
    const availableSpace = Math.max(120, openUp ? aboveSpace : belowSpace);
    const menuHeight = Math.min(preferredHeight, availableSpace);
    menu.dataset.placement = openUp ? "top" : "bottom";
    menu.style.maxHeight = `${menuHeight}px`;
    menu.style.top = `${openUp ? Math.max(viewportMargin, rect.top - menuHeight - menuGap) : Math.min(rect.bottom + menuGap, window.innerHeight - menuHeight - viewportMargin)}px`;
    control.setAttribute("aria-expanded", "true");
  }

  function enhanceEcoSelects(root = document) {
    root.querySelectorAll("select.eco-select:not([data-eco-select-enhanced])").forEach((select) => {
      if (select.classList.contains("hidden") || select.multiple) return;
      select.dataset.ecoSelectEnhanced = "true";
